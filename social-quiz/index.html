<script>
// [이동준 파트 문제 은행 (100문항)]
const dongjunQuizData = [
    { q: "개인의 자율성과 선택을 중시하며, 개인의 자유와 권리 보호를 사회 정의의 핵심으로 보는 정의관은?", a: ["공동체주의적 정의관", "자유주의적 정의관", "전제주의적 정의관", "전통주의적 정의관"], correct: 1, exp: "자유주의적 정의관은 개인의 자율성과 선택, 자유와 권리 보호를 최우선으로 여깁니다." },
    { q: "인간을 공동체의 영향을 받는 존재로 보고, 공동선의 실현과 연대 의식을 강조하는 정의관은?", a: ["자유주의적 정의관", "공동체주의적 정의관", "공리주의적 정의관", "개인주의적 정의관"], correct: 1, exp: "공동체주의적 정의관은 개인과 공동체의 유기적 관계, 공동선 및 연대 의식을 중시합니다." },
    { q: "롤스(J. Rawls)가 공정한 합의 조건을 위해 가정한 '자신의 사회적 지위나 타고난 능력을 모르는 상태'를 무엇이라 하는가?", a: ["최소 국가", "무지의 베일", "자연 상태", "서사적 정체성"], correct: 1, exp: "롤스는 '무지의 베일'을 바탕으로 한 원초적 입장에서 공정한 분배 원칙이 도출된다고 보았습니다." },
    { q: "노직(R. Nozick)이 주장한, 정당한 소유권과 개인의 자유를 침해하지 않는 국가의 형태는?", a: ["복지 국가", "최소 국가", "전능 국가", "공동체 국가"], correct: 1, exp: "노직은 개인의 자유와 소유권을 보호하는 역할만 수행하는 '최소 국가'를 지향했습니다." },

    { q: "공공장소 마스크 착용 의무화에 대해 '개인의 신체 자율권과 선택의 자유를 침해한다'며 반대하는 관점은?", a: ["공동체주의적 정의관", "자유주의적 정의관", "덕 윤리적 정의관", "사회주의적 정의관"], correct: 1, exp: "자유주의적 정의관은 개개인의 자율성과 선택 권리를 침해하는 국가 개입을 비판합니다." },

    { q: "마이클 월저(M. Walzer)가 주장한 정의론으로, '사회적 가치마다 고유한 영역과 독자적 분배 기준이 존재해야 한다'는 이론은?", a: ["다원적 정의론", "최소 국가론", "공리주의 정의론", "단일적 분배론"], correct: 0, exp: "월저는 사회적 가치(돈, 권력, 교육 등)마다 서로 다른 분배 기준이 작용해야 한다는 다원적 정의론을 제시했습니다." },

// 전체 문제 데이터 (이동준 + 정유미 + 최혁순 = 300문항 통합 데이터베이스)
const allQuizData = [...dongjunQuizData, ...yumiQuizData, ...hyuksoonQuizData];

let currentUser = "";
let activeQuizData = [];
let currentQ = 0;
let score = 0;

// 오답 저장 배열
let wrongAnswers = [];

// 타이머 변수
let timerInterval = null;
let timeLeft = 30;
let isTimerEnabled = false;
let timeLimit = 30;
let inProgress = false; // 풀이 중인지 (메인 이동 시 확인용)
let answered = false;   // 현재 문제에 답했는지

// 풀어본 문제·틀린 문제를 브라우저에 저장 (문제 문장으로 식별)
let store = {};
try { store = JSON.parse(localStorage.getItem('socialQuiz_v1')) || {}; } catch (e) {}
store.seen = store.seen || [];
store.wrong = store.wrong || [];
function saveStore() { try { localStorage.setItem('socialQuiz_v1', JSON.stringify(store)); } catch (e) {} }

// ponytail: 한 번 맞히면 오답에서 뺌(찍어서 맞혀도 빠짐). 필요하면 "2번 연속 정답 시 제거"로.
function record(q, isCorrect) {
    if (!store.seen.includes(q)) store.seen.push(q);
    const i = store.wrong.indexOf(q);
    if (isCorrect && i >= 0) store.wrong.splice(i, 1);
    if (!isCorrect && i < 0) store.wrong.push(q);
    saveStore();
}

const POOLS = { '이동준': dongjunQuizData, '정유미': yumiQuizData, '최혁순': hyuksoonQuizData, '민기백': mingibaekQuizData };
function getPool(name) {
    if (name === '내 오답') return [...allQuizData, ...mingibaekQuizData].filter(x => store.wrong.includes(x.q));
    return POOLS[name] || allQuizData;
}

// 문제 은행에서의 원래 번호 (오답노트 표시용: "최혁순 83번")
function qLabel(q) {
    for (const [name, arr] of Object.entries(POOLS)) {
        const i = arr.findIndex(x => x.q === q);
        if (i >= 0) return `${name} ${i + 1}번`;
    }
    return '';
}

// 메인 화면: 풀어본 문제 수, 내 오답 버튼, 지난 설정 복원
function updateMain() {
    document.querySelectorAll('.cov[data-pool]').forEach(el => {
        const pool = getPool(el.dataset.pool);
        el.innerText = `풀어본 문제 ${pool.filter(x => store.seen.includes(x.q)).length} / ${pool.length}`;
    });
    const n = getPool('내 오답').length;
    document.getElementById('my-wrong-btn').style.display = n ? 'flex' : 'none';
    document.getElementById('my-wrong-count').innerText = `지금까지 틀린 ${n}문제`;
    if (store.timer) document.getElementById('timer-select').value = store.timer;
    if (store.count) document.getElementById('count-select').value = store.count;
}

// 중간에 끝내고 푼 데까지만 채점
function finishEarly() {
    const n = currentQ + (answered ? 1 : 0);
    if (n === 0) { inProgress = false; goHome(); return; }
    clearInterval(timerInterval);
    activeQuizData = activeQuizData.slice(0, n);
    showFinalResult();
}

// 키보드: 1~4 선택, Enter 다음 문제
document.addEventListener('keydown', e => {
    if (!inProgress) return;
    const btns = document.querySelectorAll('#options .btn');
    if (!answered && e.key >= '1' && e.key <= '4' && btns[e.key - 1]) {
        btns[e.key - 1].click();
    } else if (answered && e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
    }
});

updateMain();

// 배열 셔플 함수
function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// 퀴즈 시작 (사용자명 및 문항수 설정)
function startQuiz(userName, count) {
    currentUser = userName;
    store.timer = document.getElementById('timer-select').value;
    store.count = document.getElementById('count-select').value;
    saveStore();
    timeLimit = Number(store.timer);
    isTimerEnabled = timeLimit > 0;

    document.getElementById("user-badge").innerText = `학습자: ${currentUser}`;
    document.getElementById("main-card").style.display = "none";
    document.getElementById("review-card").style.display = "none";
    document.getElementById("quiz-card").style.display = "block";

    initQuiz(userName, count);
}

// 메인 화면 이동
function goHome() {
    if (inProgress && (currentQ > 0 || answered) && !confirm('여기서 그만할까요?\n틀린 문제는 "내 오답"에 저장되어 있어요.')) return;
    inProgress = false;
    clearInterval(timerInterval);
    document.getElementById("quiz-card").style.display = "none";
    document.getElementById("review-card").style.display = "none";
    document.getElementById("main-card").style.display = "block";
    updateMain();
    window.scrollTo(0, 0);
}

// 퀴즈 초기화
function initQuiz(userName, count) {
    const pool = getPool(userName);
    if (pool.length === 0) { inProgress = false; goHome(); return; }
    const sel = document.getElementById('count-select').value;
    const n = sel === 'all' ? pool.length : Math.min(Number(sel), pool.length);
    // 아직 안 풀어본 문제를 먼저 뽑는다
    const unseen = pool.filter(x => !store.seen.includes(x.q));
    const seen = pool.filter(x => store.seen.includes(x.q));
    const selectedQuestions = shuffle([...shuffle(unseen), ...shuffle(seen)].slice(0, n));
    
    activeQuizData = selectedQuestions.map(item => {
        const correctText = item.a[item.correct];
        const shuffledOptions = shuffle(item.a);
        const newCorrectIndex = shuffledOptions.indexOf(correctText);
        
        return {
            q: item.q,
            a: shuffledOptions,
            correct: newCorrectIndex,
            exp: item.exp
        };
    });
    
    currentQ = 0;
    score = 0;
    wrongAnswers = []; // 오답 기록 초기화
    loadQuiz();
}

// 문제 로드
function loadQuiz() {
    inProgress = true;
    answered = false;
    document.getElementById("finish-btn").style.display = "block";
    window.scrollTo(0, 0);
    clearInterval(timerInterval);
    document.getElementById("result").innerText = "";
    document.getElementById("next-btn").style.display = "none";
    
    const progressPercent = ((currentQ + 1) / activeQuizData.length) * 100;
    document.getElementById("progress-bar-fill").style.width = `${progressPercent}%`;
    document.getElementById("progress").innerText = `Q${currentQ + 1} / ${activeQuizData.length}`;
    
    const qObj = activeQuizData[currentQ];
    document.getElementById("question").innerText = `Q${currentQ + 1}. ${qObj.q}`;
    
    const optContainer = document.getElementById("options");
    optContainer.innerHTML = "";
    
    qObj.a.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optContainer.appendChild(btn);
    });

    if (isTimerEnabled) {
        startTimer();
    } else {
        document.getElementById("timer-display").style.display = "none";
    }
}

// 타이머 시작
function startTimer() {
    const timerDisplay = document.getElementById("timer-display");
    timerDisplay.style.display = "inline-block";
    timeLeft = timeLimit;
    updateTimerUI();

    timerInterval = setInterval(() => {
        if (document.hidden) return; // 다른 탭·화면 꺼짐 동안은 멈춤
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timeOutAnswer();
        }
    }, 1000);
}

function updateTimerUI() {
    const timerDisplay = document.getElementById("timer-display");
    timerDisplay.innerText = `⏱️ ${timeLeft}초`;
    if (timeLeft <= 5) {
        timerDisplay.style.backgroundColor = "#EB3B5A";
        timerDisplay.style.color = "#FFFFFF";
    } else {
        timerDisplay.style.backgroundColor = "#3A2E56";
        timerDisplay.style.color = "#FF70A6";
    }
}

// 시간 초과 처리
function timeOutAnswer() {
    const qObj = activeQuizData[currentQ];
    const resDiv = document.getElementById("result");
    const btns = document.querySelectorAll(".btn");

    btns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === qObj.correct) {
            b.classList.add("correct-ans");
        } else {
            b.classList.add("dimmed");
        }
    });

    answered = true;
    record(qObj.q, false);
    wrongAnswers.push({ ...qObj, userChoice: -1 });

    resDiv.style.color = "#EB3B5A";
    resDiv.innerText = "⏰ 시간 초과! " + qObj.exp;

    showNextButton();
}

// 정답 확인
function checkAnswer(selected) {
    clearInterval(timerInterval);
    const qObj = activeQuizData[currentQ];
    const resDiv = document.getElementById("result");
    const btns = document.querySelectorAll(".btn");
    
    btns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === qObj.correct) {
            b.classList.add("correct-ans");
        } else if (idx === selected) {
            b.classList.add("wrong-ans");
        } else {
            b.classList.add("dimmed");
        }
    });

    answered = true;
    record(qObj.q, selected === qObj.correct);

    if (selected === qObj.correct) {
        score++;
        resDiv.style.color = "#20BF6B";
        resDiv.innerText = "⭕ 정답입니다! " + qObj.exp;
    } else {
        wrongAnswers.push({ ...qObj, userChoice: selected });

        resDiv.style.color = "#EB3B5A";
        resDiv.innerText = "❌ 오답입니다! " + qObj.exp;
    }

    showNextButton();
}

function showNextButton() {
    const nextBtn = document.getElementById("next-btn");
    if (currentQ === activeQuizData.length - 1) {
        nextBtn.innerText = "🏁 최종 결과 보기 ▶";
    } else {
        nextBtn.innerText = "다음 문제로 ▶";
    }
    nextBtn.style.display = "block";
    nextBtn.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function nextQuestion() {
    currentQ++;
    if (currentQ < activeQuizData.length) {
        loadQuiz();
    } else {
        showFinalResult();
    }
}

// 등급 산출 로직
function getGradeInfo(percentage) {
    if (percentage === 100) return { title: "🥇 1등급 (100점)", color: "#FFD700", desc: "축하합니다! 완벽하게 풀었습니다." };
    if (percentage >= 90) return { title: "🥇 1등급 (90~99점)", color: "#FFD700", desc: "매우 높은 점수입니다. 오답이 있다면 다시 확인해보세요." };
    if (percentage >= 80) return { title: "🥈 2등급 (80~89점)", color: "#C0C0C0", desc: "좋은 점수입니다. 틀린 문제를 복습해보세요." };
    if (percentage >= 70) return { title: "🥉 3등급 (70~79점)", color: "#CD7F32", desc: "기본 개념을 확인하고 오답을 복습해보세요." };
    if (percentage >= 60) return { title: "🏅 4등급 (60~69점)", color: "#A29BFE", desc: "틀린 문제를 중심으로 개념을 다시 확인해보세요." };
    return { title: "📖 5등급 이하 (0~59점)", color: "#EB3B5A", desc: "기본 개념을 복습한 뒤 다시 도전해보세요." };
}

// 최종 결과 화면
function showFinalResult() {
    inProgress = false;
    document.getElementById("finish-btn").style.display = "none";
    window.scrollTo(0, 0);
    clearInterval(timerInterval);
    document.getElementById("progress-bar-fill").style.width = "100%";
    document.getElementById("progress").innerText = "풀이 완료";
    document.getElementById("question").innerText = `🏁 테스트 완료!`;
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("timer-display").style.display = "none";
    
    const percentage = Math.round((score / activeQuizData.length) * 100);
    const grade = getGradeInfo(percentage);

    let htmlContent = `
        <div class="grade-badge-card" style="border-color: ${grade.color};">
            <div class="grade-title" style="color: ${grade.color};">${grade.title}</div>
            <div class="grade-desc">${grade.desc}</div>
            <div class="score-info">
                정답수: <strong>${score}</strong> / ${activeQuizData.length}문항 (${percentage}점)
            </div>
        </div>
    `;

    if (wrongAnswers.length > 0) {
        htmlContent += `
            <button class="btn" style="text-align:center; font-weight:bold; background-color:#EB3B5A; color:white; border:none;" onclick="showReview()">📝 오답노트 보기 (${wrongAnswers.length}문제)</button>
            <button class="btn" style="text-align:center; font-weight:bold; background-color:#6C5CE7; color:white; border:none;" onclick="startWrongQuiz()">🔄 오답 문제만 다시 풀기</button>
        `;
    } else {
        htmlContent += `
            <div style="color: #20BF6B; font-weight: bold; margin: 10px 0;">🎉 오답이 없습니다! 완벽합니다.</div>
        `;
    }

    htmlContent += `
        <button class="btn" style="text-align:center; font-weight:bold; background-color:#252536; color:#CBD5E0;" onclick="startQuiz('${currentUser}')">🔄 처음부터 다시 풀기</button>
    `;

    document.getElementById("options").innerHTML = htmlContent;
    document.getElementById("result").innerText = "";
}

// 오답노트 목록 보기
function showReview() {
    document.getElementById("quiz-card").style.display = "none";
    document.getElementById("review-card").style.display = "block";
    window.scrollTo(0, 0);

    const listDiv = document.getElementById("review-list");
    listDiv.innerHTML = "";

    wrongAnswers.forEach((item, idx) => {
        const itemBox = document.createElement("div");
        itemBox.className = "review-item";

        const userAnsText = item.userChoice === -1 ? "⏰ 시간 초과" : `${item.userChoice + 1}. ${item.a[item.userChoice]}`;
        const correctAnsText = `${item.correct + 1}. ${item.a[item.correct]}`;

        itemBox.innerHTML = `
            <div class="review-q">Q${idx + 1}. ${item.q} <small style="opacity:.55; font-weight:normal;">[${qLabel(item.q)}]</small></div>
            <div class="review-user-ans">❌ 내가 선택한 답: ${userAnsText}</div>
            <div class="review-correct-ans">⭕ 정답: ${correctAnsText}</div>
            <div class="review-exp">💡 <strong>해설:</strong> ${item.exp}</div>
        `;
        listDiv.appendChild(itemBox);
    });
}

// 오답만 모아서 다시 퀴즈 진행
function startWrongQuiz() {
    if (wrongAnswers.length === 0) return;

    activeQuizData = wrongAnswers.map(item => {
        const correctText = item.a[item.correct];
        const shuffledOptions = shuffle(item.a);
        const newCorrectIndex = shuffledOptions.indexOf(correctText);

        return {
            q: item.q,
            a: shuffledOptions,
            correct: newCorrectIndex,
            exp: item.exp
        };
    });

    currentQ = 0;
    score = 0;
    wrongAnswers = [];

    document.getElementById("review-card").style.display = "none";
    document.getElementById("quiz-card").style.display = "block";
    loadQuiz();
}
</script>
