  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --accent: #c8f63c;
    --text: #f5f6f8;
    --dim: #9aa0ab;
    --faint: #5b6068;
    --line: rgba(255, 255, 255, 0.10);
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;

    cursor: none;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 2.4vh 3vh 4.2vh;
  }

  /* ---------- 시계 + 날씨 ---------- */
  #clockRow {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 2vh;
  }
  #weatherBox { text-align: right; padding-bottom: 2.1vh; flex-shrink: 0; }
  #wTop {
    font-size: 4.2vh;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #wIcon { margin-right: 0.9vh; }
  #wSub {
    font-size: 1.9vh;
    font-weight: 600;
    color: var(--dim);
    margin-top: 0.4vh;
    white-space: nowrap;
  }
  #clock {
    font-size: 9.6vh;
    font-weight: 800;
    letter-spacing: -0.25vh;
    line-height: 1.04;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  #clock .sec {
    font-size: 4vh;
    font-weight: 700;
    color: var(--faint);
    margin-left: 1.2vh;
    letter-spacing: 0;
  }

  /* ---------- 날짜 · D-day ---------- */
  #subline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 2vh;
    margin-top: 0.6vh;
  }
  #date { font-size: 2.7vh; font-weight: 600; color: var(--dim); white-space: nowrap; }
  #date b { color: var(--text); font-weight: 800; }
  #ddayPanel {
    font-size: 2.7vh;
    font-weight: 700;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
  }
  .dday b { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
  .dday small { font-size: 2vh; font-weight: 600; color: var(--faint); margin-left: 0.7vh; }

  .div {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2vh 0;
  }

    margin-top: 1.1vh;

    border: 0.42vh solid rgba(255, 92, 80, 0.85);

  }
  #examBan .sub { font-size: 2.2vh; font-weight: 800; color: #ffb0a9; margin-top: 0.5vh; letter-spacing: 0.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }

    10%       { border-color: rgba(255, 170, 156, 1);  background: rgba(255, 42, 36, 0.50); box-shadow: 0 0 7vh rgba(255, 42, 36, 0.8), inset 0 0 4.5vh rgba(255, 42, 36, 0.3); }
    22%       { border-color: rgba(255, 92, 80, 0.5);  background: rgba(255, 60, 54, 0.14); box-shadow: 0 0 0.8vh rgba(255,60,54,0.12); }
    34%       { border-color: rgba(255, 170, 156, 1);  background: rgba(255, 42, 36, 0.50); box-shadow: 0 0 7vh rgba(255, 42, 36, 0.8), inset 0 0 4.5vh rgba(255, 42, 36, 0.3); }
    55%, 100% { border-color: rgba(255, 92, 80, 0.45); background: rgba(255, 60, 54, 0.12); box-shadow: 0 0 0 rgba(255,60,54,0); }
  }
  @keyframes banShake {
    0%, 100% { transform: translateX(0) rotate(0) scale(1); }
    20%      { transform: translateX(-0.5vh) rotate(-11deg) scale(1.16); }
    45%      { transform: translateX(0.5vh) rotate(11deg) scale(1.06); }
    70%      { transform: translateX(-0.4vh) rotate(-8deg) scale(1.14); }
  }
  @keyframes textShake {
    0%, 36%, 76%, 100% { transform: translateX(0) rotate(0); }
    39% { transform: translateX(-0.6vh) rotate(-0.7deg); }
    42% { transform: translateX(0.6vh) rotate(0.7deg); }
    45% { transform: translateX(-0.45vh); }
    48% { transform: translateX(0.32vh); }
    79% { transform: translateX(-0.65vh) rotate(-0.7deg); }
    82% { transform: translateX(0.65vh) rotate(0.7deg); }
    85% { transform: translateX(-0.45vh); }
    88% { transform: translateX(0.3vh); }
  }
  @keyframes mainGlow {
    0%, 55%, 100% { color: #ff7b71; text-shadow: 0 0 2.2vh rgba(255, 60, 54, 0.55); }
    10%, 34%      { color: #ffd6cf; text-shadow: 0 0 4.2vh rgba(255, 95, 84, 1), 0 0 1.4vh rgba(255,255,255,0.55); }

  .conf-보도 { color: #ffd98a; }

    color: var(--dim);

  .uni-fact {
    display: grid;
    grid-template-columns: 8vh 1fr;
    column-gap: 1.8vh;
    padding: 0.5vh 0;

    margin-top: 1.0vh;
    font-size: 1.8vh; font-weight: 600; color: var(--faint);
    line-height: 1.45; word-break: keep-all;

  .uni-tip b { color: var(--dim); }

  /* ---------- 하단 정보 ---------- */
  #infoGrid { }
  .row {
    display: grid;
    grid-template-columns: 7.5vh 1fr;
    column-gap: 1.8vh;
    padding: 0.85vh 0;
    align-items: start;

  .row + .row { border-top: 1px solid var(--line); }
  .row .k { font-size: 1.7vh; font-weight: 800; color: var(--dim); letter-spacing: 0.1em; padding-top: 0.15vh; }
  .row .v {
    font-size: 1.8vh; font-weight: 600; color: #c3c8d1; line-height: 1.45;
    overflow: hidden; max-height: calc(1.8vh * 1.45 * 2.15);
    word-break: keep-all;

  .row .v b { color: var(--text); font-weight: 800; }
  #schedTxt { display: block; }
  #schedTxt .sl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #schedTxt .sl + .sl { margin-top: 0.2vh; }

  #updated { position: fixed; bottom: 0.5vh; right: 1.2vh; font-size: 1.4vh; color: rgba(255,255,255,0.16); }
</style>
</head>

var autoDdays = [];
function renderDdays() {
  var today = new Date(); today.setHours(0,0,0,0);
  var all = CONFIG.DDAYS.concat(autoDdays), seen = {}, parts = [];
  all.forEach(function(d) {
    if (seen[d.name]) return; seen[d.name] = 1;

}

/* ---------- 학사일정 (구글시트 JSONP) ---------- */
function jsonpSheet(gid, cbName, scriptId, onError) {
  var old=$(scriptId); if(old) old.remove();
  var s=document.createElement('script');
  s.id=scriptId;
  s.src='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:json%3BresponseHandler:'+cbName+'&gid='+gid+'&_='+Date.now();
  s.onerror=onError; document.body.appendChild(s);
}

function grade1Parts(line) {
  var out=[], segs=line.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/), carry='';
  for(var i=0;i<segs.length;i++){
    var m=segs[i].match(/^([①②③④⑤⑥⑦⑧⑨⑩]*)([\s\S]*)$/);
    var circles=carry+m[1], text=m[2].trim();
    if(!text){carry=circles;continue;} carry='';
    if(circles===''||circles.indexOf('①')>=0) out.push(text);
  }
  return out;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function handleSched(resp) {
  try {
    var cols=resp.table.cols, rows=resp.table.rows;
    var grid=[cols.map(function(c){return c.label||'';})];
    rows.forEach(function(r){ grid.push((r.c||[]).map(function(c){return c&&c.v!=null?String(c.v):'';})); });
    var now=new Date(), sy=(now.getMonth()+1>=3)?now.getFullYear():now.getFullYear()-1;
    var blocks=[];
    for(var hr=0;hr<Math.min(3,grid.length)&&blocks.length===0;hr++){
      for(var c=1;c<grid[hr].length-1;c++){
        var mm=String(grid[hr][c]).match(/(?:(\d{4})년\s*)?(\d{1,2})월/);
        if(!mm) continue;
        var mo=Number(mm[2]); if(mo<1||mo>12) continue;
        blocks.push({col:c,month:mo,year:mm[1]?Number(mm[1]):(mo>=3?sy:sy+1)});
      }
    }
    var today=new Date(); today.setHours(0,0,0,0);
    var limit=new Date(today); limit.setDate(limit.getDate()+60);
    var evts=[];
    blocks.forEach(function(b){
      for(var r=1;r<grid.length;r++){
        var row=grid[r], day=Number(row[b.col-1]);
        if(!day||day<1||day>31) continue;
        var content=String(row[b.col+1]||'').trim(); if(!content) continue;
        var d=new Date(b.year,b.month-1,day);
        if(d.getMonth()!==b.month-1||d<today||d>limit) continue;
        content.split('\n').forEach(function(line){
          grade1Parts(line.trim()).forEach(function(t){ if(t.length>1) evts.push({d:d,t:t}); });
        });
      }
    });
    evts.sort(function(a,b){return a.d-b.d;});
    var seen={},dateOrder=[],byDate={};
    evts.forEach(function(e){
      var key=e.d.getTime()+'|'+e.t; if(seen[key]) return; seen[key]=1;
      var dk=e.d.getTime(); if(!byDate[dk]){byDate[dk]=[];dateOrder.push(dk);} byDate[dk].push(e.t);
    });
    var lines=dateOrder.slice(0,2).map(function(dk){
      var d=new Date(Number(dk)), isToday=d.getTime()===today.getTime();
      var head=isToday?'오늘':(d.getMonth()+1)+'/'+d.getDate()+'('+DAYS[d.getDay()]+')';
      return '<span class="sl"><b>'+head+'</b> '+byDate[dk].map(escapeHtml).join(' · ')+'</span>';
    });
    setBar('schedTxt',lines.length?lines.join(''):'예정된 학사일정이 없습니다');
  } catch(e){ setBar('schedTxt','학사일정을 읽을 수 없습니다'); }
}
window.handleSched = handleSched;

  jsonpSheet(CONFIG.SCHED_GID,'handleSched','schedjs',function(){setBar('schedTxt','시트에 연결할 수 없습니다');});
}
