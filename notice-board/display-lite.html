<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>영락고 1학년부 공지 디스플레이</title>
<style>
  /* ============ 영락고 1학년부 공지 디스플레이 — 리디자인 (세로 1080×1920) ============
     에디토리얼 다크 · 라임 액센트(#c8f63c) · 하드웨어 가속 없이 가벼운 표면 시스템 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --u: 19.2px; /* 1 '세로 vh' = 1920px/100, 스테이지 고정 단위 */
    --bg:        #060607;
    --bg-grad:   #0c0d0f;
    --surface:   rgba(255, 255, 255, 0.028);
    --surface-2: rgba(255, 255, 255, 0.05);
    --accent:    #c8f63c;
    --accent-dim:rgba(200, 246, 60, 0.16);
    --text:      #f4f5f7;
    --dim:       #969cab;
    --faint:     #5a6069;
    --line:      rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.06);
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    cursor: none;
    -webkit-font-smoothing: antialiased;

  /* 세로 모니터 출력: 1080×1920 스테이지를 화면에 꽉 맞게 스케일 */
  #screen {
    position: fixed; inset: 0;
    background: var(--bg);
    overflow: hidden;
  }
  #app {
    position: absolute; left: 50%; top: 50%;
    width: 1080px; height: 1920px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: calc(var(--u) * 2.4) calc(var(--u) * 3) calc(var(--u) * 2.6);
    gap: 0;
  }

  /* ---------- 아이덴티티 바 ---------- */
  #idBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: calc(var(--u) * 1.3);
    margin-bottom: 0;
    border-bottom: 1px solid var(--line-soft);
  }
  #idBar .brand {
    display: flex; align-items: center; gap: calc(var(--u) * 1.3);
    font-size: calc(var(--u) * 1.75); font-weight: 800; letter-spacing: 0.14em;
    color: var(--text); text-transform: none;
  }
  #idBar .brand .bdot {
    width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.25); border-radius: 50%;
    background: var(--accent);
  }
  #idBar .brand em { color: var(--faint); font-style: normal; font-weight: 700; letter-spacing: 0.18em; }
  #idBar .live {
    display: flex; align-items: center; gap: calc(var(--u) * 0.9);
    font-size: calc(var(--u) * 1.55); font-weight: 800; letter-spacing: 0.22em;
    color: var(--dim);
  }
  #idBar .live .pip { width: calc(var(--u) * 0.85); height: calc(var(--u) * 0.85); border-radius: 50%; background: var(--accent); animation: livePip 2.6s ease-in-out infinite; }
  @keyframes livePip { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }

  /* ---------- 시계 + 날씨 ---------- */
  #clockRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: calc(var(--u) * 2);
    margin-top: calc(var(--u) * 1.1);
  }
  #clock {
    font-size: calc(var(--u) * 7.9);
    font-weight: 850;
    letter-spacing: -0.03em;
    line-height: 0.92;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  #clock .sec {
    font-size: calc(var(--u) * 3.6);
    font-weight: 700;
    color: var(--faint);
    margin-left: calc(var(--u) * 1.4);
    letter-spacing: 0;
    vertical-align: baseline;
  }

  #weatherBox {
    text-align: right; flex-shrink: 0;
    padding-top: calc(var(--u) * 0.4);
  }
  #wTop {
    font-size: calc(var(--u) * 4.4); font-weight: 800; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--u) * 0.6);
    line-height: 1;
  }
  #wIcon { font-size: calc(var(--u) * 3.6); }
  #wSub {
    font-size: calc(var(--u) * 1.85); font-weight: 600; color: var(--dim);
    margin-top: calc(var(--u) * 0.9); white-space: nowrap; line-height: 1.4;
  }
  #wSub span { color: var(--dim); }

  /* ---------- 날짜 · D-day ---------- */
  #subline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: calc(var(--u) * 2);
    margin-top: calc(var(--u) * 1.0);
  }
  #date { font-size: calc(var(--u) * 2.9); font-weight: 700; color: var(--dim); white-space: nowrap; letter-spacing: 0.01em; }
  #date b { color: var(--text); font-weight: 800; }
  #ddayPanel {
    font-size: calc(var(--u) * 2.5); font-weight: 700; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-align: right;
    display: flex; gap: calc(var(--u) * 1.4); align-items: baseline; justify-content: flex-end;
  }
  .dday {
    display: inline-flex; align-items: baseline; gap: calc(var(--u) * 0.7);
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.3); border-radius: 99px;

  .dday b { color: var(--accent); font-weight: 850; font-variant-numeric: tabular-nums; font-size: calc(var(--u) * 2.2); }
  .dday small { font-size: calc(var(--u) * 1.7); font-weight: 600; color: var(--faint); }

  /* ---------- 현재 교시 (헤더 상태 라인) ---------- */
  #periodBar { margin-top: calc(var(--u) * 0.9); }
  #periodTxt {
    display: block; text-align: center; font-size: calc(var(--u) * 2.1); font-weight: 700; color: #cdd2da;
    line-height: 1.3; max-height: calc(calc(var(--u) * 2.1) * 1.3 * 1.08);
    overflow: hidden; word-break: keep-all;
  }

  /* ---------- 출제기간 경고 배너 ---------- */
  #examBan {
    display: none;
    align-items: center;
    gap: calc(var(--u) * 1.0);
    margin-top: calc(var(--u) * 0.9);
    padding: calc(var(--u) * 0.7) calc(var(--u) * 2.0);
    border-radius: calc(var(--u) * 2);
    border: calc(var(--u) * 0.32) solid rgba(255, 92, 80, 0.85);
    background: rgba(255, 60, 54, 0.14);
  }
  #examBan.on { display: flex; animation: banBreath 2.4s ease-in-out infinite; }
  #examBan .ico {
    font-size: calc(var(--u) * 3.6); line-height: 1; flex-shrink: 0;
  }
  #examBan .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  #examBan .main {
    font-size: calc(var(--u) * 3.2); font-weight: 900; color: #ff8478; line-height: 1.06; letter-spacing: 0.01em;
    white-space: pre-line; word-break: keep-all;
    text-shadow: 0 0 calc(var(--u) * 2.4) rgba(255, 60, 54, 0.5);
  }
  #examBan .sub {
    font-size: calc(var(--u) * 2.0); font-weight: 800; color: #ffb0a9; margin-top: calc(var(--u) * 0.35);
    letter-spacing: 0.04em; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  @keyframes banBreath {
    0%, 100% { border-color: rgba(255, 92, 80, 0.55); background: rgba(255, 60, 54, 0.13);
               box-shadow: 0 0 0 rgba(255,60,54,0); }
    50%      { border-color: rgba(255, 150, 138, 1);  background: rgba(255, 50, 44, 0.28);
               box-shadow: 0 0 calc(var(--u) * 5) rgba(255, 50, 44, 0.45), inset 0 0 calc(var(--u) * 3) rgba(255, 50, 44, 0.18); }
  }

  /* ---------- 대학 카드 패널 (히어로) ---------- */
  #noticePanel {
    flex: 1 1 auto;
    min-height: calc(var(--u) * 20);
    margin-top: calc(var(--u) * 1.0);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: calc(var(--u) * 1.1) calc(var(--u) * 2.2);
    border: 1px solid var(--line);
    border-radius: calc(var(--u) * 2.4);
    background: var(--surface);
  }
  #noticeHead {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: calc(var(--u) * 0.6);
  }
  #noticeTitle {
    display: flex; align-items: center; gap: calc(var(--u) * 1.2);
    font-size: calc(var(--u) * 2); font-weight: 800; color: var(--text); letter-spacing: 0.1em;
  }
  #noticeTitle::before {
    content: ""; width: calc(var(--u) * 0.9); height: calc(var(--u) * 2.2); border-radius: 99px; background: var(--accent);
  }
  #noticeCount {
    font-size: calc(var(--u) * 1.5); font-weight: 700; color: var(--faint);
    font-variant-numeric: tabular-nums; letter-spacing: 0.08em;
  }
  #noticeCount b { color: var(--dim); }
  /* 단일 프로그레스 바 */
  #noticeDots {
    height: calc(var(--u) * 0.42);
    background: rgba(255, 255, 255, 0.07);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: calc(var(--u) * 0.8);
  }
  #noticeDots i { display: block; height: 100%; width: 0; background: var(--accent); }
  @keyframes prog { from { width: 0; } to { width: 100%; } }

  #noticeBody {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── 대학 카드 내용 ── */
  #uniCard {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 1;
    transition: none;
  }
  #uniCard.on { opacity: 1; transform: none; }

  .uni-chips { display: flex; gap: calc(var(--u) * 1); flex-wrap: wrap; margin-bottom: calc(var(--u) * 0.6); }
  .uni-chip {
    font-size: calc(var(--u) * 1.75); font-weight: 800;
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.3); border-radius: 99px; letter-spacing: 0.04em;
  }
  .uni-chip.cat { background: var(--surface-2); color: var(--dim); border: 1px solid var(--line); }
  .uni-chip.conf { border: 1px solid currentColor; background: rgba(255,255,255,0.02); }
  .conf-확정 { color: #7fe0a6; }
  .conf-보도 { color: #ffd98a; }
  .conf-미공개 { color: var(--dim); }

  .uni-name {
    font-size: calc(var(--u) * 4.1);
    font-weight: 850;
    color: var(--text);
    line-height: 1.04;
    letter-spacing: -0.022em;
    word-break: keep-all;
  }
  .uni-sub {
    font-size: calc(var(--u) * 2);
    font-weight: 600;
    color: var(--dim);
    margin-top: calc(var(--u) * 0.7);
    word-break: keep-all;
  }

  .uni-facts { flex: 0 0 auto; min-height: 0; overflow: hidden; margin-top: calc(var(--u) * 0.7); display: flex; flex-direction: column; }
  .uni-fact {
    display: grid;
    grid-template-columns: calc(var(--u) * 8.5) 1fr;
    column-gap: calc(var(--u) * 2);
    padding: calc(var(--u) * 0.5) 0;
    border-top: 1px solid var(--line-soft);
    align-items: start;
  }
  .uni-fact:first-child { border-top: none; padding-top: 0; }
  .uni-fact .k {
    font-size: calc(var(--u) * 1.5); font-weight: 800; color: var(--faint); letter-spacing: 0.1em;
    padding-top: calc(var(--u) * 0.55); white-space: nowrap; overflow: hidden; text-transform: uppercase;
  }
  .uni-fact .v {
    font-size: calc(var(--u) * 2); font-weight: 600; color: #cdd2da; line-height: 1.38;
    word-break: keep-all; overflow: hidden; max-height: calc(calc(var(--u) * 2) * 1.38 * 2.15);
  }
  .uni-fact .v b { color: var(--accent); font-weight: 800; }

  .uni-point {
    flex-shrink: 0;
    margin-top: calc(var(--u) * 0.7);
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 0.8) calc(var(--u) * 1.5);
    border-radius: calc(var(--u) * 1.4);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
  }
  .uni-point .badge {
    flex-shrink: 0;
    font-size: calc(var(--u) * 1.7); font-weight: 900;
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.1); border-radius: calc(var(--u) * 0.8);
    background: var(--accent); color: #000;
    white-space: nowrap; letter-spacing: 0.02em;
  }
  .uni-point .ptxt { font-size: calc(var(--u) * 1.9); font-weight: 600; color: #d3d8e0; line-height: 1.3; word-break: keep-all; }
  .uni-point .ptxt b { color: var(--text); font-weight: 800; }

  .uni-tip {
    margin-top: calc(var(--u) * 1.0);
    font-size: calc(var(--u) * 1.8); font-weight: 600; color: var(--faint);
    line-height: 1.45; word-break: keep-all;
  }
  .uni-tip b { color: var(--dim); }

  /* ---------- 하단 정보 ---------- */
  #infoGrid {
    margin-top: calc(var(--u) * 1.4);
    padding-top: calc(var(--u) * 1.4);
    border-top: 1px solid var(--line);
  }
  .row {
    display: block;
    padding: calc(var(--u) * 0.46) 0;
  }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .row .k {
    font-size: calc(var(--u) * 1.6); font-weight: 800; color: var(--faint); letter-spacing: 0.14em;
    padding-top: calc(var(--u) * 0.3); text-transform: uppercase;
  }
  .row .v {
    font-size: calc(var(--u) * 2); font-weight: 600; color: #cdd2da; line-height: 1.28;
    overflow: hidden; max-height: calc(calc(var(--u) * 2) * 1.28 * 2.05);
    word-break: keep-all;
  }
  .row .v b { color: var(--text); font-weight: 800; }
  #periodTxt b { color: var(--text); }
  #schedTxt { display: block; }
  #schedTxt .sl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #schedTxt .sl + .sl { margin-top: calc(var(--u) * 0.3); }
  #schedTxt .sl b { color: var(--text); }
  #mealTxt b { color: var(--text); }

  #updated { position: fixed; bottom: calc(var(--u) * 0.6); right: calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.4); color: rgba(255, 255, 255, 0.16); letter-spacing: 0.05em; }
</style>

<style>
  /* ===== LITE: 저사양 스틱(샤오미 등) 최적화 override =====
     - 웹폰트 제거 → 기기 내장 한글폰트 사용 (다운로드 0)

  * { text-shadow: none !important; box-shadow: none !important; }
  body {
    background: var(--bg) !important;
    font-family: 'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','맑은 고딕',

  #idBar .live .pip { animation: none !important; }
  /* 출제기간 경고 배너: 색/테두리는 유지하되 애니메이션만 정지 */

  #uniCard { transition: none !important; transform: none !important; opacity: 1 !important; }
</style>
</head>

var $ = function (id) { return document.getElementById(id); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

/* ---------- 시계 ---------- */
function tickClock() {
  var n = new Date();
  $('clock').innerHTML = pad(n.getHours()) + ':' + pad(n.getMinutes()) +
    '<span class="sec">' + pad(n.getSeconds()) + '</span>';
  $('date').innerHTML = (n.getMonth() + 1) + '월 ' + n.getDate() + '일 <b>' + DAYS[n.getDay()] + '요일</b>';
  if (n.getHours() === CONFIG.RELOAD_HOUR && n.getMinutes() === 0 && n.getSeconds() === 0) location.reload();
  if (n.getSeconds() === 0) renderExamBan();
}
setInterval(tickClock, 1000);
tickClock();

/* ---------- 출제기간 배너 ---------- */
function renderExamBan() {
  var el = $('examBan'), b = CONFIG.EXAM_BAN;
  if (!b) { el.classList.remove('on'); return; }
  var today = new Date(); today.setHours(0,0,0,0);
  var from = new Date(b.from + 'T00:00:00'), to = new Date(b.to + 'T00:00:00');
  if (today >= from && today <= to) {
    el.querySelector('.main').textContent = b.text;
    el.querySelector('.sub').textContent = b.sub || '';
    el.classList.add('on');
  } else { el.classList.remove('on'); }
}

/* ---------- D-day ---------- */
var autoDdays = [];
function renderDdays() {
  var today = new Date(); today.setHours(0,0,0,0);
  var all = CONFIG.DDAYS.concat(autoDdays), seen = {}, parts = [];
  all.forEach(function(d) {
    if (seen[d.name]) return; seen[d.name] = 1;
    var diff = Math.round((new Date(d.date + 'T00:00:00') - today) / 86400000);
    if (diff < 0) return;
    parts.push('<span class="dday">' + d.name + ' <b>' + (diff===0?'D-DAY':'D-'+diff) + '</b></span>');
  });
  $('ddayPanel').innerHTML = parts.join(' &nbsp; ');
}

var barCache = {};
function setBar(id, valHtml) {
  barCache[id] = valHtml;
  var v = $(id);
  v.innerHTML = valHtml;
  var size = 2.15;
  v.style.fontSize = (size * 19.2).toFixed(2) + 'px';
  var guard = 0;
  while (v.scrollHeight > v.clientHeight + 2 && size > 1.45 && guard < 30) {
    size -= 0.1; v.style.fontSize = (size * 19.2).toFixed(2) + 'px'; guard++;
  }
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() {
    for (var id in barCache) setBar(id, barCache[id]);
    renderUniCard();
  });
}

/* ---------- 데이터 로딩 실패 시 빠른 자동 재시도 (8·16·32·60·60…초, 최대 6회) ----------
   부팅 직후 와이파이가 늦게 붙거나 중간에 끊겨도 몇 초~몇 분 안에 스스로 복구됨.
   6회 모두 실패하면 그때 에러 문구를 띄우고, 이후 기존 30분/6시간 주기로 계속 재시도. */
function retryDelay(attempt){ return Math.min(60, 8 * Math.pow(2, attempt)) * 1000; }
var RETRY_MAX = 6;

/* ---------- 급식 ---------- */
function ymd(d) { return '' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }
function loadMeal(attempt) {
  attempt = attempt || 0;
  fetch('https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=' + CONFIG.ATPT +
    '&SD_SCHUL_CODE=' + CONFIG.SCHOOL + '&MLSV_YMD=' + ymd(new Date()))
    .then(function(r){return r.json();}).then(function(j){
      var rows = j.mealServiceDietInfo && j.mealServiceDietInfo[1] && j.mealServiceDietInfo[1].row;
      if (!rows || !rows.length) { setBar('mealTxt','오늘은 급식이 없습니다'); return; }
      var meal = rows.filter(function(r){return r.MMEAL_SC_NM==='중식';})[0] || rows[0];
      var items = meal.DDISH_NM.split(/<br\s*\/?>/i).map(function(s){
        return s.replace(/\([0-9. ]+\)/g,'').replace(/[*♥]/g,'').replace(/\[[^\]]*\]/g,'').trim();
      }).filter(Boolean);
      setBar('mealTxt','<b>' + meal.MMEAL_SC_NM + '</b> · ' + items.join(' · '));
    }).catch(function(){
      if (attempt < RETRY_MAX) { setTimeout(function(){ loadMeal(attempt+1); }, retryDelay(attempt)); }
      else { setBar('mealTxt','정보를 불러올 수 없습니다'); }
    });
}

/* ---------- 현재 교시 ---------- */
function toMin(hm) { var p=hm.split(':'); return Number(p[0])*60+Number(p[1]); }
function tickPeriod() {
  var n=new Date(), day=n.getDay();
  if (day===0||day===6) { setBar('periodTxt','오늘은 <b>주말</b>입니다'); return; }
  var cur=n.getHours()*60+n.getMinutes(), P=CONFIG.PERIODS;
  if (cur<toMin(P[0].s)) { setBar('periodTxt','등교 시간 — <b>'+P[0].name+' '+P[0].s+'</b> 시작'); return; }
  if (cur>=toMin(P[P.length-1].e)) { setBar('periodTxt','오늘 일과가 끝났습니다'); return; }
  for (var i=0;i<P.length;i++) {
    if (cur>=toMin(P[i].s)&&cur<toMin(P[i].e)) {
      setBar('periodTxt','지금 <b>'+P[i].name+'</b> ('+P[i].s+'~'+P[i].e+')'); return;
    }
    if (P[i+1]&&cur>=toMin(P[i].e)&&cur<toMin(P[i+1].s)) {
      setBar('periodTxt','<b>쉬는시간</b>'); return;
    }
  }
  setBar('periodTxt','—');
}
setInterval(tickPeriod, 20000);
tickPeriod();

    $('wIcon').textContent=code[0]; $('wTemp').textContent=Math.round(cw.temperature_2m)+'°';
    var sub=[];
    if(res[0].daily) sub.push(Math.round(res[0].daily.temperature_2m_min[0])+'~'+Math.round(res[0].daily.temperature_2m_max[0])+'°');
    if(res[1]&&res[1].current) sub.push('미세먼지 '+pmGrade(res[1].current.pm10,res[1].current.pm2_5));
    $('wSub').innerHTML=sub.map(function(s){return '<span>'+s+'</span>';}).join('<br>');
  }).catch(function(){
    if (attempt < RETRY_MAX) { setTimeout(function(){ loadWeather(attempt+1); }, retryDelay(attempt)); }
    else { $('wIcon').textContent='';$('wTemp').textContent='';$('wSub').textContent=''; }
  });
}

/* ---------- D-day 자동 (NEIS 고사 감지) ---------- */
function loadDday(attempt) {
  attempt = attempt || 0;
  var from=new Date(), to=new Date(); to.setDate(to.getDate()+45);
  fetch('https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pSize=100&ATPT_OFCDC_SC_CODE='+CONFIG.ATPT+'&SD_SCHUL_CODE='+CONFIG.SCHOOL+'&AA_FROM_YMD='+ymd(from)+'&AA_TO_YMD='+ymd(to))
    .then(function(r){return r.json();}).then(function(j){
      var rows=(j.SchoolSchedule&&j.SchoolSchedule[1]&&j.SchoolSchedule[1].row)||[];
      var todayYmd=ymd(new Date());
      var exam=rows.filter(function(r){return r.EVENT_NM&&r.EVENT_NM.indexOf('고사')>=0&&r.AA_YMD>=todayYmd;})[0];
      autoDdays=[];
      if(exam){
        var dstr=exam.AA_YMD.slice(0,4)+'-'+exam.AA_YMD.slice(4,6)+'-'+exam.AA_YMD.slice(6,8);
        autoDdays.push({name:exam.EVENT_NM.replace(/\s*\(.*\)/,''),date:dstr});
      }
      renderDdays();
    }).catch(function(){
      if (attempt < RETRY_MAX) { setTimeout(function(){ loadDday(attempt+1); }, retryDelay(attempt)); }
      else { renderDdays(); }
    });
}

/* ---------- 학사일정 (구글시트 JSONP) ---------- */
function jsonpSheet(gid, cbName, scriptId, onError) {
  var old=$(scriptId); if(old) old.remove();
  var s=document.createElement('script');
  s.id=scriptId;
  s.src='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:json%3BresponseHandler:'+cbName+'&gid='+gid+'&_='+Date.now();
  s.onerror=onError; document.body.appendChild(s);
}

function grade1Parts(line) {
  var out=[], segs=line.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/), carry='';
  for(var i=0;i<segs.length;i++){
    var m=segs[i].match(/^([①②③④⑤⑥⑦⑧⑨⑩]*)([\s\S]*)$/);
    var circles=carry+m[1], text=m[2].trim();
    if(!text){carry=circles;continue;} carry='';
    if(circles===''||circles.indexOf('①')>=0) out.push(text);
  }
  return out;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function handleSched(resp) {
  try {
    var cols=resp.table.cols, rows=resp.table.rows;
    var grid=[cols.map(function(c){return c.label||'';})];
    rows.forEach(function(r){ grid.push((r.c||[]).map(function(c){return c&&c.v!=null?String(c.v):'';})); });
    var now=new Date(), sy=(now.getMonth()+1>=3)?now.getFullYear():now.getFullYear()-1;
    var blocks=[];
    for(var hr=0;hr<Math.min(3,grid.length)&&blocks.length===0;hr++){
      for(var c=1;c<grid[hr].length-1;c++){
        var mm=String(grid[hr][c]).match(/(?:(\d{4})년\s*)?(\d{1,2})월/);
        if(!mm) continue;
        var mo=Number(mm[2]); if(mo<1||mo>12) continue;
        blocks.push({col:c,month:mo,year:mm[1]?Number(mm[1]):(mo>=3?sy:sy+1)});
      }
    }
    var today=new Date(); today.setHours(0,0,0,0);
    var limit=new Date(today); limit.setDate(limit.getDate()+60);
    var evts=[];
    blocks.forEach(function(b){
      for(var r=1;r<grid.length;r++){
        var row=grid[r], day=Number(row[b.col-1]);
        if(!day||day<1||day>31) continue;
        var content=String(row[b.col+1]||'').trim(); if(!content) continue;
        var d=new Date(b.year,b.month-1,day);
        if(d.getMonth()!==b.month-1||d<today||d>limit) continue;
        content.split('\n').forEach(function(line){
          grade1Parts(line.trim()).forEach(function(t){ if(t.length>1) evts.push({d:d,t:t}); });
        });
      }
    });
    evts.sort(function(a,b){return a.d-b.d;});
    var seen={},dateOrder=[],byDate={};
    evts.forEach(function(e){
      var key=e.d.getTime()+'|'+e.t; if(seen[key]) return; seen[key]=1;
      var dk=e.d.getTime(); if(!byDate[dk]){byDate[dk]=[];dateOrder.push(dk);} byDate[dk].push(e.t);
    });
    var lines=dateOrder.slice(0,2).map(function(dk){
      var d=new Date(Number(dk)), isToday=d.getTime()===today.getTime();
      var head=isToday?'오늘':(d.getMonth()+1)+'/'+d.getDate()+'('+DAYS[d.getDay()]+')';
      return '<span class="sl"><b>'+head+'</b> '+byDate[dk].map(escapeHtml).join(' · ')+'</span>';
    });
    setBar('schedTxt',lines.length?lines.join(''):'예정된 학사일정이 없습니다');
  } catch(e){ setBar('schedTxt','학사일정을 읽을 수 없습니다'); }
}
window.handleSched = handleSched;

function loadSchedule(attempt) {
  attempt = attempt || 0;
  jsonpSheet(CONFIG.SCHED_GID,'handleSched','schedjs',function(){
    if (attempt < RETRY_MAX) { setTimeout(function(){ loadSchedule(attempt+1); }, retryDelay(attempt)); }
    else { setBar('schedTxt','시트에 연결할 수 없습니다'); }
  });
}

<script>
/* ===== 세로 모니터 출력: 스테이지를 화면 크기에 맞춰 스케일 =====
   화면이 옆으로 누워 보이면(스틱이 가로로 출력) ROTATE 를 90 또는 270 으로 바꾸세요. */
(function () {
  var ROTATE = 0; // 0 · 90 · 180 · 270
  function fit() {
    var app = document.getElementById('app');
    if (!app) return;
    var W = window.innerWidth, H = window.innerHeight;
    var rot = ((ROTATE % 360) + 360) % 360, swap = (rot === 90 || rot === 270);
    var s = Math.min(W / (swap ? 1920 : 1080), H / (swap ? 1080 : 1920));
    app.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
})();
</script>
