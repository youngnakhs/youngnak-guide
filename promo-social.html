<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세상을 읽는 힘 — 정치·법과 사회·국제관계의 이해 (영락고 사회 진로선택 티저)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0E1512; --paper:#FBFAF7;
  --green:#16C76B; --lime:#BEF250; --coral:#FF5B4A; --cyan:#19C3D6;
  --blue:#2D5BFF; --yellow:#FFD23F; --lilac:#9B6BFF; --teal:#00B89C;
}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Pretendard Variable',Pretendard,sans-serif;}
.jua{font-family:'Paperlogy',sans-serif;font-weight:800;letter-spacing:-.5px;}

#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#frame{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:var(--ink);transition:background .25s;}
/* 강당용 세이프존: 하단 ~24%는 비움 */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:62px 84px 172px;color:#fff;}
.scene.dark{color:#fff;} .scene.lite{color:var(--ink);}

/* grain/glow deco */
#frame::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 18%, rgba(255,255,255,.10), transparent 60%);}

/* ---- type system ---- */
.kick{display:inline-block;font-size:24px;font-weight:800;padding:9px 20px;border-radius:999px;margin-bottom:26px;letter-spacing:.5px;}
.hero{font-size:128px;line-height:1.02;}
.hero.sm{font-size:96px;}
.hero.xs{font-size:78px;}
.mid{font-size:64px;line-height:1.08;}
.sup{font-size:38px;font-weight:700;line-height:1.35;opacity:.95;}
.sup.dim{opacity:.72;font-weight:600;font-size:32px;}
.ln{overflow:hidden;display:block;}
.ln>span{display:inline-block;transform:translateY(115%);animation:rise .72s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.05s + var(--i,0)*.12s);}
@keyframes rise{to{transform:none;}}

.mk{background-image:linear-gradient(var(--c,var(--lime)),var(--c,var(--lime)));background-repeat:no-repeat;background-position:0 92%;background-size:0% 40%;animation:mk .5s cubic-bezier(.7,0,.3,1) forwards;animation-delay:calc(.55s + var(--i,0)*.12s);padding:0 .04em;}
@keyframes mk{to{background-size:100% 40%;}}
.box{background:var(--c,var(--yellow));color:var(--ink);padding:.02em .16em;border-radius:.1em;display:inline-block;}
.out{color:transparent;-webkit-text-stroke:3px currentColor;}

.stk{font-size:88px;display:inline-block;}
.row{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:18px;align-items:center;}

.hitrow{display:flex;flex-direction:column;gap:16px;align-items:center;}
.hit{font-size:54px;font-weight:800;font-family:'Paperlogy',sans-serif;letter-spacing:-.4px;}
.hit .e{font-size:50px;margin-right:14px;}

.units{display:flex;flex-direction:column;gap:14px;align-items:stretch;width:100%;max-width:920px;}
.u{display:flex;align-items:center;gap:20px;font-size:46px;font-weight:800;font-family:'Paperlogy',sans-serif;
  background:rgba(255,255,255,.14);border-radius:18px;padding:14px 26px;letter-spacing:-.4px;}
.u .nn{font-size:34px;opacity:.7;min-width:46px;}
.u small{font-size:24px;font-weight:600;opacity:.78;margin-left:auto;font-family:'Pretendard Variable';}

.chiprow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
.chip2{font-size:34px;font-weight:800;font-family:'Paperlogy',sans-serif;padding:12px 24px;border-radius:999px;
  background:rgba(255,255,255,.16);}
.chip2.solid{background:#fff;color:var(--ink);}

.tagline{font-size:28px;font-weight:700;opacity:.85;}
.tags{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.tag2{font-size:28px;font-weight:700;padding:9px 18px;border-radius:12px;background:rgba(255,255,255,.16);}

/* subject giant intro */
.classtag{font-size:28px;font-weight:800;padding:9px 22px;border-radius:999px;background:rgba(255,255,255,.2);margin-bottom:18px;}
.giant{font-size:172px;line-height:.98;}
.giant.two{font-size:118px;}

/* entrance utils */
@keyframes pop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:none;}}
@keyframes up{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:none;}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-14px) rotate(2deg);}}
@keyframes spin{from{transform:rotate(-8deg);}50%{transform:rotate(8deg);}to{transform:rotate(-8deg);}}
.p{opacity:0;animation:pop .55s cubic-bezier(.2,1.5,.35,1) forwards;animation-delay:calc(var(--i,0)*.12s);}
.up{opacity:0;animation:up .6s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:calc(var(--i,0)*.12s);}
.fd{opacity:0;animation:fade .7s ease forwards;animation-delay:calc(var(--i,0)*.12s);}
.flo{animation:flo 3.4s ease-in-out infinite;}
.spin{animation:spin 2.6s ease-in-out infinite;}

/* progress (상단) */
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:7px 10px 0;z-index:30;}
.sg{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;}
.sg i{display:block;height:100%;width:0;background:#fff;}
.sg.done i{width:100%;}
html[data-on-lite] .sg{background:rgba(0,0,0,.18);} html[data-on-lite] .sg i{background:var(--ink);}

/* UI (상단, 자동 숨김) */
#ui{position:absolute;top:18px;right:18px;display:flex;gap:7px;z-index:31;opacity:0;transition:opacity .25s;}
#ui.show{opacity:1;}
.cb{width:38px;height:38px;border-radius:10px;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);}
.cb:hover{background:rgba(0,0,0,.6);}
#wm{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:9px;z-index:25;opacity:.92;}
#wm .d{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);font-family:'Paperlogy';font-size:17px;display:flex;align-items:center;justify-content:center;}
#wm span{font-size:15px;font-weight:800;}
.scene.lite ~ #wm{color:var(--ink);}
</style>
</head>
<body>
<div id="wrap"><div id="frame">
  <div class="scene" id="stage"></div>
  <div id="wm"><span class="d">Y</span><span>영락고 진로·대입 정보센터</span></div>
  <div id="top"></div>
  <div id="ui">
    <button class="cb" id="pp" onclick="toggle()">⏸</button>
    <button class="cb" onclick="go(idx-1)">⏮</button>
    <button class="cb" onclick="go(idx+1)">⏭</button>
    <button class="cb" onclick="fs()">⛶</button>
  </div>
</div></div>

/* 5 subjects */{dur:8,bg:V.paper,lite:1,html:()=>`

/* 6 */{dur:6,bg:V.coral,html:()=>`

  <div class="tags"><span class="tag2 fd" style="--i:3">정치외교학</span><span class="tag2 fd" style="--i:4">행정학</span><span class="tag2 fd" style="--i:5">언론정보학</span></div>`},

/* 11 법 intro */{dur:8,bg:V.coral,html:()=>`
  <div class="stk spin" style="--i:0">⚖️</div>
  <div class="classtag p" style="--i:0">사회 · 진로선택</div>

  <div class="sup fd" style="--i:3;margin-top:14px">“내 권리는, 내가 지킨다.”</div>`},
/* 12 법 단원 */{dur:10,bg:V.coral,html:()=>`
  <div class="kick up" style="--i:0;background:rgba(255,255,255,.2)">⚖️ 법과 사회 · 이런 걸 배워</div>

    <div class="u up" style="--i:1"><span class="nn">①</span>개인 생활과 법<small>계약·가족·재산</small></div>
    <div class="u up" style="--i:2"><span class="nn">②</span>국가 생활과 법<small>헌법·기본권·권력분립</small></div>
    <div class="u up" style="--i:3"><span class="nn">③</span>사회 생활과 법<small>형사절차·근로·소비자</small></div>
    <div class="u up" style="--i:4"><span class="nn">④</span>학교 생활과 법<small>학교폭력·청소년 권리</small></div>
  </div>`},
/* 13 법 키워드 */{dur:8,bg:V.coral,html:()=>`
  <div class="chiprow" style="margin-bottom:30px">
    <span class="chip2 p" style="--i:0">계약·임대차</span><span class="chip2 p" style="--i:1">형사 절차</span>
    <span class="chip2 p" style="--i:2">근로</span><span class="chip2 p" style="--i:3">학교폭력</span>
  </div>
  <div class="hero sm jua up" style="--i:4">👩‍⚖️ 모의재판 · 판례 분석</div>`},
/* 14 법 진로 */{dur:9,bg:V.coral,html:()=>`
  <div class="tagline up" style="--i:0">🔍 꼼꼼 + 정의감 충만이라면</div>
  <div class="hero sm jua up" style="--i:1;margin:16px 0 18px"><span class="mk" style="--c:var(--yellow)">판사·검사·변호사·경찰</span></div>
  <div class="tags"><span class="tag2 fd" style="--i:3">법학·로스쿨</span><span class="tag2 fd" style="--i:4">경찰행정학</span><span class="tag2 fd" style="--i:5">행정학</span></div>`},

/* 15 국제 intro */{dur:8,bg:V.teal,html:()=>`
  <div class="stk spin" style="--i:0">🌐</div>
  <div class="classtag p" style="--i:0">사회 · 진로선택</div>
  <div class="giant two jua p" style="--i:1">국제관계의 이해</div>
  <div class="sup fd" style="--i:3;margin-top:14px">“세계는 어떻게 연결될까?”</div>`},

/* 17 국제 활동/진로 */{dur:9,bg:V.teal,html:()=>`
  <div class="hero sm jua up" style="--i:0;margin-bottom:20px">🇺🇳 모의 UN · 국제이슈 분석</div>

  <div class="hero xs jua up" style="--i:2;margin:14px 0 16px"><span class="mk" style="--c:var(--yellow)">외교관 · 국제기구 · 통상</span></div>
  <div class="tags"><span class="tag2 fd" style="--i:4">정치외교(국제정치)</span><span class="tag2 fd" style="--i:5">국제학부</span><span class="tag2 fd" style="--i:6">국제통상학</span></div>`},

/* 18 입시 */{dur:9,bg:V.yellow,lite:1,html:()=>`
  <div class="kick up" style="--i:0;background:var(--ink);color:#fff">📈 입시에선 이렇게 강력</div>
  <div class="hero sm jua">${L('학생부 <span class="box" style="--c:var(--coral);color:#fff">한 방</span> 💥',0)}</div>
  <div class="sup up" style="--i:3;margin-top:18px">세특 · 탐구활동 · 면접 · 논술에서<br><b>전공적합성</b>을 증명</div>`},

  <div class="hero jua up" style="--i:1;margin-top:20px">하나라도 <span class="mk" style="--c:var(--lime)">끄덕?</span></div>

/* 20 CTA */{dur:11,bg:'linear-gradient(150deg,#10351f,#16C76B)',html:()=>`

  <div class="hero sm jua">${L('수강신청 때',0)}${L('<span class="mk" style="--c:var(--yellow)">잊지 마!</span>',1)}</div>
  <div class="sup up" style="--i:3;margin:20px 0 8px">정치 · 법과 사회 · 국제관계의 이해</div>
  <div class="sup dim up" style="--i:4">담임·진로진학상담 선생님과 상담 → 신청 기간에 선택!</div>
  <div class="tagline fd" style="--i:6;margin-top:18px">🧭 youngnakhs.github.io/youngnak-guide</div>`},
];

/* ===== engine ===== */
const frame=document.getElementById('frame'), stage=document.getElementById('stage'),
      prog=document.getElementById('top'), ui=document.getElementById('ui'), pp=document.getElementById('pp'), wm=document.getElementById('wm');
let idx=0, elapsed=0, paused=false, last=0;
prog.innerHTML=scenes.map(()=>`<div class="sg"><i></i></div>`).join('');
const sgs=[...prog.querySelectorAll('.sg')];

function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);frame.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

function render(n){
  idx=(n+scenes.length)%scenes.length; elapsed=0;
  const sc=scenes[idx];
  frame.style.background=sc.bg;
  stage.className='scene '+(sc.lite?'lite':'dark');
  if(sc.lite){document.documentElement.setAttribute('data-on-lite','');wm.style.color='var(--ink)';}
  else{document.documentElement.removeAttribute('data-on-lite');wm.style.color='#fff';}
  stage.innerHTML=sc.html();
  sgs.forEach((s,k)=>{s.classList.toggle('done',k<idx);s.querySelector('i').style.width=k<idx?'100%':'0%';});
}
function tick(ts){
  if(!last)last=ts; const dt=ts-last; last=ts;
  if(!paused){
    elapsed+=dt; const d=scenes[idx].dur*1000;
    sgs[idx].querySelector('i').style.width=Math.min(100,elapsed/d*100)+'%';
    if(elapsed>=d) render(idx+1);   /* 마지막 → 처음으로 루프 */
  }
  requestAnimationFrame(tick);
}
function go(n){paused=false;pp.textContent='⏸';render(n);}
function toggle(){paused=!paused;pp.textContent=paused?'▶':'⏸';}
function fs(){const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen&&el.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();}

let hideT;
function poke(){ui.classList.add('show');clearTimeout(hideT);hideT=setTimeout(()=>ui.classList.remove('show'),2600);}
addEventListener('mousemove',poke);addEventListener('touchstart',poke);
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key.toLowerCase()==='f')fs();
  poke();
});

render(0);requestAnimationFrame(tick);
</script>
</body>
</html>
