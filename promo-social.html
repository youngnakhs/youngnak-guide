<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세상을 읽는 힘 — 정치·법과 사회·국제관계의 이해 (영락고 사회 진로선택)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#14181F; --dim:#5B6470; --line:#E7EAEE; --bg:#FBFAF7;
  --blue:#3D6BFF; --blue-s:#EAF0FF; --coral:#FF5B4A; --coral-s:#FFECE9;
  --teal:#00A88E; --teal-s:#E1F5F0; --amber:#FFB020; --amber-s:#FFF4DD;
  --lilac:#8B5CF6; --lilac-s:#F1ECFE; --green:#1F9D63;
}
html,body{height:100%;background:#0c0e12;overflow:hidden;font-family:'Pretendard Variable',Pretendard,sans-serif;}
.jua{font-family:'Paperlogy',sans-serif;font-weight:800;letter-spacing:-.4px;}

/* stage */
#stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#frame{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;
  background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.scene{position:absolute;inset:0;padding:74px 78px 110px;display:flex;flex-direction:column;}
.scene.ctr{align-items:center;justify-content:center;text-align:center;}

/* brand watermark */
.wm{position:absolute;top:22px;right:26px;display:flex;align-items:center;gap:8px;z-index:6;opacity:.9;}
.wm .d{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-family:'Paperlogy';font-size:15px;display:flex;align-items:center;justify-content:center;}
.wm span{font-size:13px;font-weight:700;color:var(--dim);}

/* caption bar */
#cap{position:absolute;left:0;right:0;bottom:34px;text-align:center;z-index:7;padding:0 90px;}
#cap b{display:inline-block;background:rgba(16,18,24,.86);color:#fff;font-size:23px;font-weight:600;line-height:1.5;
  padding:11px 22px;border-radius:12px;max-width:1050px;backdrop-filter:blur(4px);}
.capkey{color:#ffd84d;font-weight:800;}

/* progress + controls */
#bar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20;
  background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);}
#segs{flex:1;display:flex;gap:4px;}
.seg{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
.seg i{display:block;height:100%;width:0;background:#fff;border-radius:99px;}
.seg.done i{width:100%;}
#ctrls{display:flex;align-items:center;gap:6px;}
.cbtn{width:34px;height:34px;border-radius:9px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;}
.cbtn:hover{background:rgba(255,255,255,.3);}
#tlabel{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;opacity:.85;min-width:78px;text-align:right;}

/* end overlay */
#end{position:absolute;inset:0;background:rgba(8,10,14,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:9;backdrop-filter:blur(3px);}
#end.show{display:flex;}
#end h3{color:#fff;font-size:30px;}
#end .rb{display:flex;gap:12px;}
#end button{border:none;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Paperlogy';}

/* ---- components ---- */
.kick{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:18px;font-weight:800;
  padding:8px 16px;border-radius:999px;margin-bottom:18px;}
.scene.ctr .kick{align-self:center;}
.h-big{font-size:74px;line-height:1.1;color:var(--ink);}
.h-mid{font-size:54px;line-height:1.14;color:var(--ink);}
.sub{font-size:25px;color:var(--dim);margin-top:18px;line-height:1.5;font-weight:500;}
.hl{color:var(--blue);}

.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px;width:100%;}
.kcard{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 8px 22px rgba(20,24,31,.06);}
.kcard .ic{font-size:42px;}
.kcard h4{font-size:24px;margin:12px 0 8px;}
.kcard p{font-size:16.5px;color:var(--dim);line-height:1.55;}

/* subject deep layout */
.deep{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;flex:1;align-items:center;}
.unitlist{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
.unit{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(20,24,31,.05);}
.unit .n{width:34px;height:34px;border-radius:9px;color:#fff;font-family:'Paperlogy';font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.unit .t{font-size:20px;font-weight:700;}
.unit .t small{display:block;font-size:13.5px;color:var(--dim);font-weight:500;margin-top:2px;}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 10px 26px rgba(20,24,31,.08);}
.plabel{font-size:14px;font-weight:800;letter-spacing:.4px;color:var(--dim);margin-bottom:12px;text-transform:uppercase;}
.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{font-size:17px;font-weight:700;padding:8px 14px;border-radius:999px;}
.actbox{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:18px;color:var(--ink);line-height:1.5;}
.actbox b{font-weight:800;}

/* big subject title block */
.subj-hero{display:flex;flex-direction:column;align-items:center;text-align:center;}
.badge-class{font-size:18px;font-weight:800;padding:7px 16px;border-radius:999px;margin-bottom:20px;}
.subj-name{font-size:96px;line-height:1;}
.subj-q{font-size:30px;color:var(--dim);margin-top:22px;font-weight:600;}
.subj-em{font-size:120px;margin-bottom:6px;}

/* careers */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;align-items:center;}
.list-ic{display:flex;flex-direction:column;gap:13px;}
.li{display:flex;align-items:flex-start;gap:13px;font-size:21px;line-height:1.4;}
.li .e{font-size:26px;flex-shrink:0;}
.tagwrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.tg{font-size:18px;font-weight:700;padding:9px 16px;border-radius:12px;}

/* hook floating news */
.news{position:absolute;font-size:20px;font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;box-shadow:0 10px 24px rgba(20,24,31,.1);color:var(--ink);}
.news .src{color:var(--coral);font-weight:800;margin-right:8px;}

/* checklist */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:16px 30px;margin-top:34px;width:100%;max-width:980px;}
.ck{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:600;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 20px;}
.ck .b{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

/* CTA */
.cta-big{font-size:84px;line-height:1.08;}
.cta-card{display:flex;gap:16px;margin-top:30px;}
.cta-step{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:22px;text-align:left;box-shadow:0 8px 20px rgba(20,24,31,.06);}
.cta-step .num{font-family:'Paperlogy';font-size:15px;color:#fff;background:var(--green);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.cta-step h4{font-size:21px;margin-bottom:5px;}
.cta-step p{font-size:15.5px;color:var(--dim);line-height:1.5;}
.cta-link{margin-top:26px;font-size:22px;font-weight:800;color:var(--green);}

/* entrance animations (re-run on innerHTML swap) */
@keyframes sUp{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:none;}}
@keyframes sPop{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
@keyframes sFade{from{opacity:0;}to{opacity:1;}}
@keyframes sRight{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:none;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
@keyframes capIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.a-up{opacity:0;animation:sUp .65s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:calc(var(--i,0)*.13s);}
.a-pop{opacity:0;animation:sPop .6s cubic-bezier(.2,1.5,.35,1) forwards;animation-delay:calc(var(--i,0)*.13s);}
.a-fade{opacity:0;animation:sFade .8s ease forwards;animation-delay:calc(var(--i,0)*.13s);}
.a-right{opacity:0;animation:sRight .6s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:calc(var(--i,0)*.1s);}
.float{animation:floatY 4s ease-in-out infinite;}
#cap b{animation:capIn .5s ease both;}

@media(max-width:560px){ #cap b{font-size:18px;padding:9px 15px;} }
</style>
</head>
<body>
<div id="stageWrap"><div id="frame">
  <div class="wm"><span class="d jua">Y</span><span>영락고 진로·대입 정보센터</span></div>
  <div class="scene ctr" id="stage"></div>
  <div id="cap"><b></b></div>
  <div id="end">
    <h3 class="jua">세상을 읽는 힘, 지금 시작하자 ✊</h3>
    <div class="rb">
      <button onclick="replay()" style="background:var(--green);color:#fff;">↻ 다시 보기</button>
      <button onclick="location.href='index.html'" style="background:#fff;color:var(--ink);">메인으로</button>
    </div>
  </div>
</div></div>

<div id="bar">
  <div id="ctrls">
    <button class="cbtn" id="pp" onclick="toggle()">⏸</button>
    <button class="cbtn" onclick="go(idx-1)">⏮</button>
    <button class="cbtn" onclick="go(idx+1)">⏭</button>
    <button class="cbtn" onclick="fs()">⛶</button>
  </div>
  <div id="segs"></div>
  <div id="tlabel">0:00 / 0:00</div>
</div>

<script>
/* ===== content ===== */
const PV={blue:'var(--blue)',blueS:'var(--blue-s)',coral:'var(--coral)',coralS:'var(--coral-s)',teal:'var(--teal)',tealS:'var(--teal-s)'};

function unit(n,t,d,c){return `<div class="unit a-right" style="--i:${n}"><div class="n" style="background:${c}">${n}</div><div class="t">${t}<small>${d}</small></div></div>`;}
function chip(t,c,cs){return `<span class="chip" style="background:${cs};color:${c}">${t}</span>`;}

const scenes=[
/* 1 hook */
{dur:15,cap:"솔직히… 뉴스 틀면 무슨 말인지 하나도 모르겠지?",html:()=>`
  <div style="position:absolute;inset:0">
   <div class="news float a-pop" style="--i:0;top:120px;left:90px"><span class="src">속보</span>또 선거… 누구를 뽑아야 하지?</div>
   <div class="news float a-pop" style="--i:1;top:230px;right:90px;animation-delay:.4s"><span class="src">사회</span>전세 보증금 못 받았다는데…</div>
   <div class="news float a-pop" style="--i:2;bottom:230px;left:120px;animation-delay:.8s"><span class="src">국제</span>관세 전쟁·분쟁 또 격화</div>
   <div class="news float a-pop" style="--i:3;bottom:150px;right:120px;animation-delay:.2s"><span class="src">단독</span>알바 잘렸는데 월급도 안 줘?</div>
  </div>
  <div class="h-big jua a-up" style="--i:4">뉴스가 외계어처럼<br>들린 적, 있지?</div>`},
/* 2 hook2 */
{dur:13,cap:"근데 그 뉴스들… 곧 전부 ‘내 일’이 돼. 18살 투표, 첫 알바 계약, 해외에서의 진로까지.",html:()=>`
  <div class="kick a-up" style="--i:0;background:var(--amber-s);color:#b9760a">곧 너의 현실</div>
  <div class="h-mid jua a-up" style="--i:1">근데 그게 전부<br><span style="color:var(--coral)">‘내 일’</span>이 된다면?</div>
  <div class="row3">
    <div class="kcard a-up" style="--i:2"><div class="ic">🗳️</div><h4 class="jua">만 18세 투표</h4><p>고3이면 진짜 유권자. 한 표가 세상을 바꿔.</p></div>
    <div class="kcard a-up" style="--i:3"><div class="ic">📄</div><h4 class="jua">첫 알바·계약</h4><p>근로계약·월세 계약, 모르면 그대로 손해.</p></div>
    <div class="kcard a-up" style="--i:4"><div class="ic">🌍</div><h4 class="jua">글로벌 진로</h4><p>유학·외교·무역… 세계는 이미 연결돼 있어.</p></div>
  </div>`},
/* 3 title */
{dur:12,cap:"세상을 읽는 힘을 길러주는, 영락고 사회 ‘진로선택’ 3과목!",html:()=>`
  <div class="kick a-pop" style="--i:0;background:var(--green);color:#fff">영락고 사회 · 진로선택</div>
  <div class="h-big jua a-up" style="--i:1">세상을 읽는 힘<br><span style="color:var(--green)">3과목</span></div>
  <div class="row3" style="margin-top:34px">
    <div class="kcard a-pop" style="--i:2;border-color:var(--blue)"><div class="ic">🏛️</div><h4 class="jua" style="color:var(--blue)">정치</h4><p>세상은 누가, 어떻게 움직일까?</p></div>
    <div class="kcard a-pop" style="--i:3;border-color:var(--coral)"><div class="ic">⚖️</div><h4 class="jua" style="color:var(--coral)">법과 사회</h4><p>내 권리, 내가 지킨다.</p></div>
    <div class="kcard a-pop" style="--i:4;border-color:var(--teal)"><div class="ic">🌐</div><h4 class="jua" style="color:var(--teal)">국제관계의 이해</h4><p>세계는 어떻게 연결될까?</p></div>
  </div>
  <div class="sub a-fade" style="--i:6;font-size:20px">고1, 지금부터 골라두면 3년이 달라진다</div>`},
/* 4 why */
{dur:15,cap:"외우는 과목이 아니야. 내 권리를 지키고, 세상을 바꾸는 ‘진짜 무기’지.",html:()=>`
  <div class="kick a-up" style="--i:0;background:var(--lilac-s);color:#7c3aed">왜 들어야 해?</div>
  <div class="h-mid jua a-up" style="--i:1">시험용이 아니라<br><span style="color:var(--lilac)">인생용</span> 과목이야</div>
  <div class="row3">
    <div class="kcard a-up" style="--i:2"><div class="ic">🛡️</div><h4 class="jua">나를 지킨다</h4><p>계약·권리·법 절차를 알면 당하지 않아.</p></div>
    <div class="kcard a-up" style="--i:3"><div class="ic">🧠</div><h4 class="jua">생각이 자란다</h4><p>토론·분석으로 비판적 사고력 레벨업.</p></div>
    <div class="kcard a-up" style="--i:4"><div class="ic">🚀</div><h4 class="jua">진로가 열린다</h4><p>인문·사회·상경·국제 계열의 든든한 토대.</p></div>
  </div>`},

/* 5 정치 intro */
{dur:9,cap:"첫 번째, 정치. ‘세상은 누가, 어떻게 움직일까?’",html:()=>`
  <div class="subj-hero">
    <div class="subj-em a-pop" style="--i:0">🏛️</div>
    <div class="badge-class a-up" style="--i:1;background:var(--blue-s);color:var(--blue)">사회 · 진로선택</div>
    <div class="subj-name jua a-up" style="--i:2;color:var(--blue)">정치</div>
    <div class="subj-q a-fade" style="--i:3">“세상은 누가, 어떻게 움직일까?”</div>
  </div>`},
/* 6 정치 detail */
{dur:21,cap:"선거·정당부터 정부 형태, 국제 정치까지. 모의선거와 시사 토론으로 직접 부딪쳐 봐.",html:()=>`
  <div class="kick a-right" style="--i:0;background:var(--blue-s);color:var(--blue)">🏛️ 정치 · 이런 걸 배워</div>
  <div class="deep">
    <div class="unitlist">
      ${unit(1,'시민 생활과 정치','정치란? 민주주의와 시민','var(--blue)')}
      ${unit(2,'정치과정과 참여','선거·정당·여론·미디어 리터러시','var(--blue)')}
      ${unit(3,'민주 국가의 정부 형태','대통령제·의원내각제, 입법·행정·사법','var(--blue)')}
      ${unit(4,'국제 사회와 정치','국제 정치와 우리나라의 외교','var(--blue)')}
    </div>
    <div class="panel a-up" style="--i:1">
      <div class="plabel">핵심 키워드</div>
      <div class="chips">${chip('선거',PV.blue,PV.blueS)}${chip('정당·여론',PV.blue,PV.blueS)}${chip('헌법·권력분립',PV.blue,PV.blueS)}${chip('참정권',PV.blue,PV.blueS)}${chip('미디어 리터러시',PV.blue,PV.blueS)}</div>
      <div class="actbox">🎤 <b>이런 활동!</b><br>모의 선거 · 시사 토론 · 정책 제안 프로젝트</div>
    </div>
  </div>`},
/* 7 정치 career */
{dur:12,cap:"뉴스와 토론을 좋아한다면 강추! 외교관·기자·정책 전문가의 첫걸음이야.",html:()=>`
  <div class="kick a-up" style="--i:0;background:var(--blue-s);color:var(--blue)">🏛️ 정치 · 이런 너에게</div>
  <div class="two">
    <div class="list-ic">
      <div class="li a-right" style="--i:0"><span class="e">📰</span>뉴스·시사·선거에 관심이 많다</div>
      <div class="li a-right" style="--i:1"><span class="e">🗣️</span>토론하고 설득하는 게 즐겁다</div>
      <div class="li a-right" style="--i:2"><span class="e">✊</span>불공정한 걸 바꾸고 싶다</div>
    </div>
    <div class="panel a-up" style="--i:1">
      <div class="plabel">관련 학과·진로</div>
      <div class="tagwrap">
        ${chip('정치외교학과',PV.blue,PV.blueS)}${chip('행정학과',PV.blue,PV.blueS)}${chip('언론정보학',PV.blue,PV.blueS)}${chip('사회학',PV.blue,PV.blueS)}
      </div>
      <div class="actbox">🎯 외교관 · 국회/정당 · 기자 · 정책연구원 · 공무원</div>
    </div>
  </div>`},

/* 8 법 intro */
{dur:9,cap:"두 번째, 법과 사회. ‘내 권리는 내가 지킨다.’",html:()=>`

/* ===== engine ===== */
const frame=document.getElementById('frame'), stage=document.getElementById('stage'),
      capEl=document.querySelector('#cap b'), segs=document.getElementById('segs'),
      pp=document.getElementById('pp'), tlabel=document.getElementById('tlabel'), endEl=document.getElementById('end');
let idx=0, elapsed=0, paused=false, last=0, raf=null, finished=false;
const total=scenes.reduce((a,s)=>a+s.dur,0);

segs.innerHTML=scenes.map(()=>`<div class="seg"><i></i></div>`).join('');
const segFills=[...segs.querySelectorAll('.seg')];

function fit(){const s=Math.min(innerWidth/1280,(innerHeight-46)/720);frame.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function elapsedBefore(n){let t=0;for(let k=0;k<n;k++)t+=scenes[k].dur;return t;}

function render(n){
  idx=(n+scenes.length)%scenes.length; elapsed=0; finished=false; endEl.classList.remove('show');
  const sc=scenes[idx];
  stage.innerHTML=sc.html();
  capEl.style.animation='none'; void capEl.offsetWidth; capEl.style.animation='';
  capEl.innerHTML=sc.cap;
  segFills.forEach((s,k)=>{s.classList.toggle('done',k<idx); s.querySelector('i').style.width=k<idx?'100%':'0%';});
}
function tick(ts){
  if(!last)last=ts; const dt=ts-last; last=ts;
  if(!paused&&!finished){
    elapsed+=dt; const d=scenes[idx].dur*1000;
    const p=Math.min(1,elapsed/d);
    segFills[idx].querySelector('i').style.width=(p*100)+'%';
    const cur=elapsedBefore(idx)+Math.min(scenes[idx].dur,elapsed/1000);
    tlabel.textContent=fmt(cur)+' / '+fmt(total);
    if(elapsed>=d){ if(idx>=scenes.length-1){finish();} else {render(idx+1);} }
  }
  raf=requestAnimationFrame(tick);
}
function finish(){finished=true;paused=true;pp.textContent='▶';endEl.classList.add('show');tlabel.textContent=fmt(total)+' / '+fmt(total);}
function go(n){ if(n<0)n=0; if(n>scenes.length-1)n=scenes.length-1; paused=false;pp.textContent='⏸'; render(n); }
function toggle(){ if(finished){replay();return;} paused=!paused; pp.textContent=paused?'▶':'⏸'; }
function replay(){ paused=false;pp.textContent='⏸'; render(0); }
function fs(){ const el=document.documentElement; if(!document.fullscreenElement){el.requestFullscreen&&el.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();} }

addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key.toLowerCase()==='f')fs();
  else if(e.key.toLowerCase()==='r')replay();
});
stage.addEventListener('click',()=>{ if(finished)replay(); else go(idx+1); });

render(0); raf=requestAnimationFrame(tick);
</script>
