    <script>
      // 메인 hero 검색폼에서 넘어온 ?q=... 를 학과 검색창에 자동 적용 (번들 미수정·방어적 폴링)
      (function () {
        var q = new URLSearchParams(location.search).get('q');
        if (!q) return;
        var tries = 0;
        var iv = setInterval(function () {
          var el = document.getElementById('searchInput');
          if (el) {
            el.value = q;
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.focus();
            clearInterval(iv);
          } else if (++tries > 80) {
            clearInterval(iv);
          }
        }, 50);
      })();
    </script>
