<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>대학별 비교 대시보드 · 2028 대입 내비게이터</title>
    <meta name="description" content="2028학년도 주요 대학의 전형을 분류·소재지·수능최저·면접 등으로 필터링하고 정렬하며 한 표에서 비교합니다." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="2028 대입 내비게이터" />
    <meta property="og:title" content="대학별 비교 대시보드 · 2028 대입" />
    <meta property="og:description" content="분류·소재지·수능최저·면접으로 전국 주요대 전형을 필터링하고 나란히 비교하세요. 교사·학생·학부모용." />
    <meta property="og:image" content="https://youngnakhs.github.io/youngnak-guide/navigator/og.png" />
    <meta property="og:url" content="https://youngnakhs.github.io/youngnak-guide/navigator/compare.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script type="module" crossorigin src="./assets/compare-yIFYq77G.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/site-Ck_ArAu4.js">
    <link rel="modulepreload" crossorigin href="./assets/data-1fpcbxBG.js">
    <link rel="modulepreload" crossorigin href="./assets/charts-Dx4Cs95I.js">
    <link rel="stylesheet" crossorigin href="./assets/site-rAQZbQ63.css">
    <link rel="stylesheet" crossorigin href="./assets/compare-BSBBbVK_.css">
    <link rel="stylesheet" crossorigin href="./assets/mobile-2028.css">
  </head>
  <body>
    <main id="main">
      <header class="section container" style="padding-bottom:0">
        <div class="section-head">
          <span class="eyebrow">대시보드</span>
          <h1>대학별 비교</h1>
          <p class="text-soft">분류·소재지·수능최저·면접 여부로 걸러보고, 열 제목을 눌러 정렬하세요. 대학을 클릭하면 상세를 볼 수 있습니다.</p>
        </div>
      </header>

      <!-- 요약 차트 -->
      <section class="section container" style="padding-top:var(--space-5)">
        <div class="bento">
          <div class="card span-4 fade-in">
            <h3 style="font-size:var(--fs-md)">분류별 대학 수</h3>
            <div style="height:230px"><canvas id="catChart"></canvas></div>
          </div>
          <div class="card span-4 fade-in">
            <h3 style="font-size:var(--fs-md)">수능최저 적용 현황</h3>
            <div style="height:230px"><canvas id="minChart"></canvas></div>
          </div>
          <div class="card span-4 fade-in">
            <h3 style="font-size:var(--fs-md)">면접 실시 현황</h3>
            <div style="height:230px"><canvas id="intChart"></canvas></div>
          </div>
        </div>
      </section>

      <!-- 필터 -->
      <section class="section container" id="list" style="padding-top:0">
        <div class="filterbar card" id="filterBar"></div>
        <p class="text-soft" id="resultCount" aria-live="polite" style="margin:var(--space-4) 0"></p>
        <div class="table-wrap">
          <table class="data" id="compareTable">
            <caption>2028학년도 주요 대학 전형 비교 — 수치는 변동될 수 있으며 '확인 필요' 항목은 입학처 대조 권장</caption>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <!-- 선택한 대학 나란히 비교 -->
      <section class="container" id="compareView" hidden>
        <div class="section-head">
          <h2>나란히 비교</h2>
          <p class="text-soft">담은 대학을 항목별로 한눈에 비교합니다. (최대 4개)</p>
        </div>
        <div class="table-wrap" id="compareViewBody"></div>
      </section>
    </main>

    <!-- 비교 담기 트레이 (JS 주입) -->
    <div id="compareTray" class="compare-tray" hidden></div>

  </body>
</html>
