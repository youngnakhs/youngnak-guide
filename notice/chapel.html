<style>
@font-face{font-family:P;src:url(PretendardVariable.woff2) format("woff2");font-weight:100 900}
:root{--e:cubic-bezier(.16,1,.3,1);--b:cubic-bezier(.3,1.6,.5,1)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:P,sans-serif}
svg{overflow:visible}
.sc{position:absolute;inset:0;visibility:hidden;z-index:2}
.sc.on{visibility:visible}
.on .in{animation:in .8s var(--e) var(--d,0s) both}
.on .pop{animation:pop .7s var(--b) var(--d,0s) both}
.on .slam{animation:slam .55s cubic-bezier(.2,1.3,.4,1) var(--d,0s) both}
.on .sl{animation:sl .8s var(--e) var(--d,0s) both}
.on .dr{stroke-dasharray:1600;animation:dr 1.2s ease-out var(--d,0s) both}
.on .bob{animation:bob 1s ease-in-out var(--d,0s) infinite alternate}

.on .swing{transform-box:fill-box;transform-origin:50% 100%;animation:swing 1.4s ease-in-out infinite alternate}

@keyframes in{from{opacity:0;transform:translateY(50px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes slam{from{opacity:0;transform:scale(2.6)}}
@keyframes sl{from{opacity:0;transform:translateX(-160px)}}
@keyframes dr{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
@keyframes bob{to{transform:translateY(-14px)}}
@keyframes wave{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-160px) scale(1)}}
@keyframes walk{from{offset-distance:0%}to{offset-distance:100%}}
.m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .06em}
.m>span{display:inline-block}
.on .m>span{animation:up 1s var(--e) var(--d,0s) both}
@keyframes up{from{transform:translateY(110%)}}
#cap{position:absolute;z-index:6;white-space:nowrap;opacity:0;transition:opacity .4s}
#cap.on{opacity:1}

#wipe{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;inset:0;transform:translateX(-101%)}
.alt #wipe i{animation-direction:reverse!important}
.tr-rise #wipe i{transform:translateY(101%)}
.tr-rise #wipe.go i{animation:wr .9s cubic-bezier(.7,0,.3,1) var(--w,0s)}
@keyframes wr{0%{transform:translateY(101%)}40%,60%{transform:translateY(0)}100%{transform:translateY(-101%)}}
.tr-iris #wipe i{transform:none;clip-path:circle(0% at 50% 50%)}
.tr-iris #wipe.go i{animation:wi .95s cubic-bezier(.7,0,.3,1) var(--w,0s)}
@keyframes wi{0%{clip-path:circle(0% at 50% 50%);opacity:1}45%,58%{clip-path:circle(75% at 50% 50%);opacity:1}100%{clip-path:circle(75% at 50% 50%);opacity:0}}
.tr-slide #wipe.go i{animation:ws .9s cubic-bezier(.7,0,.3,1) var(--w,0s)}
@keyframes ws{0%{transform:translateX(-101%)}40%,60%{transform:translateX(0)}100%{transform:translateX(101%)}}

.tr-burst #wipe.go i{animation:wb .9s cubic-bezier(.7,0,.3,1) var(--w,0s)}
@keyframes wb{0%{transform:translateX(-140%) skewX(-22deg)}40%,60%{transform:translateX(0) skewX(-22deg)}100%{transform:translateX(140%) skewX(-22deg)}}
.tr-page #wipe i{display:none}
.tr-page .sc.on{animation:pg .6s var(--e)}
@keyframes pg{from{opacity:0;transform:translateX(40px)}}
.emb{display:block}

/* ── 1 아침 인사: 캐릭터 그림책 ── */
.v1{font-family:Jua,P,sans-serif;color:#3b2412;background:linear-gradient(180deg,#8fd0ff 0%,#cfe8ff 38%,#ffe0b0 72%,#ffc48a 100%)}

@keyframes spin{to{transform:rotate(360deg)}}
.v1 .cl{position:absolute;height:90px;width:260px;background:#fff;border-radius:60px;opacity:.9;z-index:1;animation:cl 80s linear infinite}
.v1 .cl::before{content:"";position:absolute;left:50px;top:-50px;width:130px;height:130px;border-radius:50%;background:#fff}
@keyframes cl{from{transform:translateX(-400px)}to{transform:translateX(2400px)}}
.v1 .bird{position:absolute;width:70px;z-index:1;color:#3b2412;animation:fly 26s linear infinite}
@keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(2200px,-160px)}}

.v1 .big{font-size:200px;line-height:1.05;color:#ff6a1a;text-shadow:0 8px 0 #fff}
.v1 .mid{font-size:100px;line-height:1.15}
.v1 .sub{font-size:68px;color:#7a4a22;margin-top:10px}
.v1 .o{color:#ff6a1a}
.v1 .bub{position:relative;background:#fff;border-radius:50px;padding:20px 50px;font-size:80px;box-shadow:0 10px 0 rgba(122,74,34,.15)}
.v1 .bub::after{content:"";position:absolute;left:60px;bottom:-40px;border:24px solid transparent;border-top:30px solid #fff}
.v1 .zz{position:absolute;font-size:90px;color:#4d8fd6;opacity:0}
.v1 .on .zz{animation:float 2.6s ease-out var(--d) infinite}

.v1 .cards{display:flex;gap:46px}
.v1 .card{background:#fff;border-radius:40px;padding:30px 50px 40px;font-size:76px;box-shadow:0 14px 0 rgba(122,74,34,.18);display:flex;flex-direction:column;align-items:center}
.v1 .card svg{width:170px;height:150px;margin-bottom:10px}
.v1 .card:nth-child(1){transform:rotate(-4deg)}.v1 .card:nth-child(3){transform:rotate(4deg)}
.v1 .card small{font-size:42px;color:#ff6a1a}
.v1 #cap{left:50%;bottom:40px;transform:translateX(-50%);font-size:48px;background:#fff;color:#3b2412;border-radius:60px;padding:14px 46px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.v1 #bar{background:#ff6a1a}
.v1 #wipe i{background:#ffd34d}.v1 #wipe i+i{background:#ff8a3d;--w:.06s}

/* ── 2 퀴즈쇼 ── */
.v2{font-family:"Black Han Sans",P,sans-serif;color:#fff;background:linear-gradient(180deg,#090d2e 0%,#141a52 70%,#2a1f6e 100%)}
.v2 .beam{position:absolute;top:-200px;width:420px;height:1500px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));transform-origin:50% 0;z-index:0}

.v2 .q{position:absolute;left:160px;right:440px;top:180px;height:200px;background:#fff;color:#141a52;border-radius:30px;display:flex;align-items:center;gap:40px;padding:0 60px;font-size:92px;box-shadow:0 16px 0 #ffd23f;white-space:nowrap}
.v2 .q i{font-style:normal;background:#6c4bff;color:#fff;border-radius:22px;padding:4px 30px;font-size:80px}

@keyframes tn{0%,99%{opacity:1}100%{opacity:0}}

.v2 .ding text{font-size:62px;fill:#141a52;text-anchor:middle;font-family:"Black Han Sans"}
.v2 .buzz{position:absolute;left:0;right:0;top:440px;display:flex;justify-content:center;align-items:center;gap:90px}
.v2 .dv{position:relative;color:#fff}
.v2 .dv .x{position:absolute;inset:-30px;color:#ff4d6d}

.v2 .board{position:absolute;left:200px;top:170px;width:1050px;display:flex;flex-direction:column;gap:26px}
.v2 .board div{background:#3b2b8f;border-radius:24px;padding:20px 44px;font-size:72px;display:flex;justify-content:space-between}
.v2 .board span{color:#19c98f}
.v2 .hund{position:absolute;right:160px;top:240px;width:400px;height:400px;border-radius:50%;border:18px solid #ff4d6d;color:#ff4d6d;display:flex;align-items:center;justify-content:center;font-size:150px;transform:rotate(-14deg)}
.v2 .clear{position:absolute;left:0;right:0;top:170px;display:flex;align-items:center;justify-content:center;gap:80px}
.v2 .clear .big{font-size:190px;color:#ffd23f;line-height:1}
.v2 .clear .t2{font-size:92px;margin-top:20px}
.v2 .trophy{width:400px;height:460px}

.v2 #cap{left:50%;bottom:44px;transform:translateX(-50%);font-size:46px;color:#ffd23f;background:rgba(9,13,46,.85);border:4px solid #6c4bff;border-radius:20px;padding:12px 40px}
.v2 #bar{background:#ffd23f}
.v2 #wipe i{background:#6c4bff}.v2 #wipe i+i{background:#ffd23f;--w:.08s}

/* ── 3 체크리스트: 공책 낙서 ── */
.v3{font-family:Gaegu,P,sans-serif;font-weight:700;color:#23336b;background:#fbf7ec}
.v3 .paper{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 79px,#bcd3ee 79px 82px);background-position:0 40px}

.v3 .doo{filter:url(#wob)}

.v3 #bar{background:#d8342c}

/* ── 5 마지막 안내: 뉴스 ── */
.v5{font-family:"Do Hyeon",P,sans-serif;color:#fff;background:#0b1430}

var q=location.search.match(/[?&]v=(\d)/),nw=new Date(),m=nw.getHours()*60+nw.getMinutes();

  var nl=document.getElementById('nowl');if(nl)nl.textContent='지금 '+HM();}

  var k=Math.min(X/1920,Y/1080);S.style.transform='translate('+(X-1920*k)/2+'px,'+(Y-1080*k)/2+'px) scale('+k+')';}

var SY=SAY[vn].say,VOICE_EVERY=2,AU=SY.map(function(_,j){var x=new Audio('voice/v'+vn+'-'+(j+1)+'.mp3');x.preload='auto';x.ok=false;
  x.addEventListener('loadedmetadata',function(){x.ok=isFinite(x.duration)&&x.duration>0});return x;});
var sc=S.querySelectorAll('.sc'),base=[5,4.5,5,4.5,6.5,6],i=-1,loop=-1,bar=document.getElementById('bar'),cap=document.getElementById('cap'),wp=document.getElementById('wipe');
function show(){if(i>=0)sc[i].classList.remove('on');i=(i+1)%sc.length;
  if(i==0){loop++;S.classList.toggle('alt',loop%2==1);}
  if(C.on)C.on(i);void sc[i].offsetWidth;sc[i].classList.add('on');
  var say=SY[i],d=Math.max(base[i],say.length*.16+1.4),au=AU[i];
  cap.textContent=say;cap.classList.add('on');
  if(au.ok&&loop%VOICE_EVERY==0){d=Math.max(base[i],au.duration+1.2);try{au.currentTime=0;var p=au.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition='width '+d+'s linear';bar.style.width='100%';
  setTimeout(next,d*1000);}
function next(){cap.classList.remove('on');wp.classList.remove('go');void wp.offsetWidth;wp.classList.add('go');setTimeout(show,C.tr=='page'?150:500);}
show();
