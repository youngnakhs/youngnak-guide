<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>금요 예배 안내</title>
<style>
@font-face{font-family:P;src:url(PretendardVariable.woff2) format("woff2");font-weight:100 900}
:root{--e:cubic-bezier(.16,1,.3,1)}
/* 교시별 판: 1 아침 · 2 퀴즈 · 3 체크리스트 · 4 점심 전 · 5 점심 */
.v1{--bg:#fff4e2;--ink:#2b1a0e;--dim:#a07f5e;--gold:#f26b1d;--acc2:#ffc53d;--line:#f0d8b4;--card:#fff;--mq:#f4dfbf;--glow:#ffe1a8;--hlc:rgba(255,197,61,.6)}
.v2{--bg:#05293a;--ink:#eafcff;--dim:#6ea3b2;--gold:#3fe0c5;--acc2:#5bb6ff;--line:#124659;--card:#0a394c;--mq:#0c3a4c;--glow:#0d4a5e;--hlc:rgba(63,224,197,.45)}
.v3{--bg:#1c0e2d;--ink:#fbefff;--dim:#9c80b5;--gold:#ff6fb3;--acc2:#b38bff;--line:#36204f;--card:#2a1842;--mq:#2b1844;--glow:#3a1c55;--hlc:rgba(255,111,179,.45)}
.v4{--bg:#eef6e3;--ink:#13260e;--dim:#6b8a5c;--gold:#2c9a3c;--acc2:#c3e63a;--line:#cfe2bb;--card:#fff;--mq:#dbeacb;--glow:#d9f0b8;--hlc:rgba(195,230,58,.7)}
.v5{--bg:#0b1430;--ink:#f5f0e1;--dim:#7b86a6;--gold:#f2c14e;--acc2:#e8553d;--line:#1f2b4e;--card:#141f40;--mq:#18234a;--glow:#1b2a5c;--hlc:rgba(242,193,78,.5)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  font-family:P,"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 70% 30%,var(--glow),transparent),var(--bg)}
.mq{position:absolute;white-space:nowrap;font-size:260px;font-weight:900;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:2px var(--mq);animation:mq 60s linear infinite}
.mq.a{top:-40px}.mq.b{bottom:-60px;animation-direction:reverse;animation-duration:70s}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#top{position:absolute;left:120px;right:120px;top:60px;display:flex;justify-content:space-between;font-size:38px;font-weight:700;color:var(--dim);z-index:5}
#top b{color:var(--gold)}
#bar{position:absolute;left:0;bottom:0;height:12px;background:var(--gold);width:0;z-index:5}
/* 자막(목소리 대본) */
#cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1600px;z-index:6;font-size:40px;font-weight:700;letter-spacing:-.01em;
  color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:60px;padding:12px 40px;white-space:nowrap;opacity:0;transition:opacity .4s}
#cap.on{opacity:.96}

/* 장면 전환: 판마다 다름, 바퀴마다 방향 뒤집힘(.alt) */
#wipe{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;inset:0;background:var(--gold);transform:translateX(-101%)}
#wipe i.b{background:var(--acc2)}
#wipe i.st{display:none}
.alt #wipe i{animation-direction:reverse!important}
.alt #wipe i.a{background:var(--acc2)}.alt #wipe i.b{background:var(--gold)}
/* 1 위로 쓸어 올리기 */
.tr-rise #wipe i{transform:translateY(101%)}
.tr-rise #wipe.go i.a{animation:rise_ .9s cubic-bezier(.7,0,.3,1)}
.tr-rise #wipe.go i.b{animation:rise_ .9s cubic-bezier(.7,0,.3,1) .06s}
@keyframes rise_{0%{transform:translateY(101%)}40%,60%{transform:translateY(0)}100%{transform:translateY(-101%)}}
/* 2 원이 커지며 */
.tr-iris #wipe i{transform:none;clip-path:circle(0% at 50% 50%)}
.tr-iris #wipe.go i.b{animation:iris .95s cubic-bezier(.7,0,.3,1)}
.tr-iris #wipe.go i.a{animation:iris .95s cubic-bezier(.7,0,.3,1) .08s}
@keyframes iris{0%{clip-path:circle(0% at 50% 50%);opacity:1}45%,58%{clip-path:circle(75% at 50% 50%);opacity:1}100%{clip-path:circle(75% at 50% 50%);opacity:0;transform:scale(1.15)}}
/* 3 블라인드(카드 넘기기) */
.tr-blind #wipe i.a,.tr-blind #wipe i.b{display:none}
.tr-blind #wipe i.st{display:block;inset:auto;top:0;bottom:0;width:12.6%;left:calc(var(--i)*12.5%);transform:scaleX(0);transform-origin:left}
.tr-blind #wipe i.st:nth-child(odd){background:var(--acc2)}
.tr-blind #wipe.go i.st{animation:blind .7s cubic-bezier(.7,0,.3,1) calc(var(--i)*.025s)}
@keyframes blind{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}75%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
/* 4 옆으로 밀기(두 겹) */
.tr-slide #wipe.go i.b{animation:slide .9s cubic-bezier(.7,0,.3,1)}
.tr-slide #wipe.go i.a{animation:slide .9s cubic-bezier(.7,0,.3,1) .07s}
@keyframes slide{0%{transform:translateX(-101%)}40%,60%{transform:translateX(0)}100%{transform:translateX(101%)}}
/* 5 사선 번쩍 */
.tr-burst #wipe i{left:-30%;right:-30%;transform:translateX(-140%) skewX(-22deg)}
.tr-burst #wipe.go i.b{animation:burst .9s cubic-bezier(.7,0,.3,1)}
.tr-burst #wipe.go i.a{animation:burst .9s cubic-bezier(.7,0,.3,1) .09s}
@keyframes burst{0%{transform:translateX(-140%) skewX(-22deg)}40%,60%{transform:translateX(0) skewX(-22deg)}100%{transform:translateX(140%) skewX(-22deg)}}

/* 장면 공통 틀 */
.sc{position:absolute;left:120px;right:120px;top:150px;bottom:110px;visibility:hidden}
.sc.on{visibility:visible}
.two{display:grid;grid-template-columns:760px 1fr;column-gap:120px;align-items:center;align-content:center}
.art{display:flex;justify-content:center;align-items:center;height:600px}
.txt{display:flex;flex-direction:column;align-items:flex-start}
.lab{font-size:52px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:24px}
.h{font-size:190px;font-weight:900;letter-spacing:-.045em;line-height:1.02}
.h small{font-size:.5em;letter-spacing:-.02em}
.gold{color:var(--gold)}

.m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .06em}
.m>span{display:inline-block;transform:translateY(110%)}
.alt .m>span{transform:translateY(-110%)}
.on .m>span{animation:rise 1s var(--e) var(--d,0s) forwards}
@keyframes rise{to{transform:none}}
.fade{opacity:0}.on .fade{animation:fade .8s var(--e) var(--d,0s) forwards}
@keyframes fade{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* 1 시계 */
.clock{width:580px;height:580px}
.on .clock{animation:pop 1s var(--e) both}
@keyframes pop{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.clock .ring{stroke-dasharray:1900;stroke-dashoffset:1900}
.on .clock .ring{animation:draw 1.4s var(--e) forwards}
.hh,.mh{transform-origin:350px 350px}
.on .hh{animation:hh 2s var(--e) .3s both}
.on .mh{animation:mh 2s var(--e) .3s both}
@keyframes hh{from{transform:rotate(-300deg)}to{transform:rotate(30deg)}}
@keyframes mh{from{transform:rotate(-1080deg)}to{transform:rotate(0)}}

/* 2 강당으로 + 발자국 */
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.mid .h{font-size:250px;line-height:1}
.walk{position:relative;width:1600px;height:160px;margin:10px 0 0}
.walk svg{position:absolute;width:76px;height:152px;fill:var(--gold);opacity:0}
.on .walk svg{animation:foot 3s linear var(--d) infinite}
@keyframes foot{0%{opacity:0}6%{opacity:1}55%{opacity:.85}90%,100%{opacity:0}}
.sub{font-size:56px;font-weight:600;color:var(--dim)}

/* 3 기기 */
.devs{position:relative;width:700px;height:520px}
.ph,.tb{position:absolute;bottom:50px;border:16px solid var(--ink);border-radius:46px;background:var(--card);opacity:0}
.ph{left:40px;width:190px;height:380px}
.tb{left:280px;width:380px;height:280px;border-radius:36px}
.ph::after{content:"";position:absolute;left:50%;top:14px;width:60px;height:10px;margin-left:-30px;border-radius:5px;background:var(--ink)}
.on .ph{animation:drop .9s var(--e) .1s forwards}
.on .tb{animation:drop .9s var(--e) .3s forwards}
@keyframes drop{from{opacity:0;transform:translateY(-260px) rotate(-12deg)}to{opacity:1;transform:none}}
.no{position:absolute;inset:0}
.no path,.no circle{stroke-dasharray:2000;stroke-dashoffset:2000;stroke:var(--gold)}
.on .no circle{animation:draw .8s ease-out 1.2s forwards}
.on .no path{animation:draw .5s ease-out 1.8s forwards}

/* 4 성경책 */
.book{width:660px;height:545px;overflow:visible}
.book .pl,.book .pr{transform-box:fill-box;transform:scaleX(0)}
.book .pl{transform-origin:right center}.book .pr{transform-origin:left center}
.on .book .pl,.on .book .pr{animation:unf 1s var(--e) .25s forwards}
@keyframes unf{to{transform:scaleX(1)}}
.book .cv{opacity:0}.on .book .cv{animation:fade .6s var(--e) 0s forwards}
.book .tx{stroke-dasharray:260;stroke-dashoffset:260}
.on .book .tx{animation:draw .5s ease-out var(--d) forwards}
.book .rb{transform-box:fill-box;transform-origin:top;transform:scaleY(0)}
.on .book .rb{animation:rb .7s var(--e) 1.3s forwards}
@keyframes rb{to{transform:scaleY(1)}}
.book .cr{opacity:0;transform-box:fill-box;transform-origin:center;fill:var(--gold)}
.on .book .cr{animation:crs 1s var(--e) 1s forwards}
@keyframes crs{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
.hl{background:linear-gradient(var(--hlc),var(--hlc)) no-repeat 0 82%/0% 32%;padding:0 .06em}
.on .hl{animation:hlb .7s var(--e) 1.3s forwards}
@keyframes hlb{to{background-size:100% 32%}}
@keyframes hl{to{transform:scaleX(1)}}

/* 6 학교 */
.school{display:flex;flex-direction:column;align-items:center;justify-content:center}
.emb{width:300px;height:300px;position:relative;margin-bottom:22px;opacity:0}
.emb img{width:100%;height:100%;display:block}
.on .emb{animation:emb 1.6s var(--e) .1s forwards}
@keyframes emb{0%{opacity:0;transform:scale(.3) rotate(-200deg);clip-path:circle(0% at 50% 50%)}60%{opacity:1;clip-path:circle(60% at 50% 50%)}100%{opacity:1;transform:none;clip-path:circle(60% at 50% 50%)}}
.emb::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) no-repeat;background-size:300% 100%;background-position:150% 0}
.on .emb::after{animation:shine 1.2s ease-in-out 1.7s forwards}
@keyframes shine{to{background-position:-50% 0}}
.emb .ring{position:absolute;inset:-14px;border-radius:50%;border:6px solid var(--gold);opacity:0}
.on .emb .ring{animation:ring 1.6s ease-out 1.4s 2}
@keyframes ring{0%{opacity:.9;transform:scale(.95)}100%{opacity:0;transform:scale(1.35)}}
.school .cap{font-size:36px;font-weight:700;color:var(--gold);letter-spacing:.4em;margin-bottom:10px}
.school .nm{font-size:160px;font-weight:900;letter-spacing:.4em;margin-right:-.4em;opacity:0}
.on.school .nm{animation:track 2s var(--e) 1.5s forwards}
@keyframes track{0%{opacity:0;letter-spacing:.4em;filter:blur(20px)}60%{opacity:1;filter:none}100%{opacity:1;letter-spacing:-.03em;margin-right:0}}
.school .ln{width:900px;height:5px;background:var(--gold);margin:22px 0 20px;transform:scaleX(0)}
.on.school .ln{animation:hl 1.2s var(--e) 2.4s forwards}
.school .en{font-size:44px;font-weight:600;color:var(--dim);letter-spacing:.42em}
/* 5 요약 */
.sum{display:flex;flex-direction:column;justify-content:center}
.sum .k{font-size:48px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:10px}
.sum .l1{font-size:240px;font-weight:900;letter-spacing:-.05em;line-height:.95}
.sum .l2{font-size:140px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:10px}
.rules{display:grid;grid-template-columns:1fr 1fr;margin-top:60px;position:relative}
.rules::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line);transform:scaleX(0);transform-origin:left}
.on .rules::before{animation:hl 1s var(--e) .4s forwards}
.r{padding-top:30px;font-size:80px;font-weight:800;letter-spacing:-.035em}
.r+.r{padding-left:64px;border-left:3px solid var(--line)}
.r i{display:block;font-style:normal;font-size:36px;font-weight:700;color:var(--gold);letter-spacing:.12em;margin-bottom:14px}
.r s{text-decoration-thickness:10px;text-decoration-color:var(--gold)}
</style>
</head>
<body>
<div id="s">
  <div class="mq a" id="mqa"></div>
  <div class="mq b" id="mqb"></div>
  <div id="top"><span><b>금요 예배</b> &nbsp;<span id="date"></span></span><span id="left"></span></div>

  <div class="sc two">
    <div class="art"><svg class="clock" viewBox="0 0 700 700">
      <circle class="ring" cx="350" cy="350" r="300" fill="none" style="stroke:var(--ink)" stroke-width="18"/>
      <g style="stroke:var(--dim)" stroke-width="10" stroke-linecap="round" id="ticks"></g>
      <line class="mh" x1="350" y1="350" x2="350" y2="110" style="stroke:var(--ink)" stroke-width="18" stroke-linecap="round"/>
      <line class="hh" x1="350" y1="350" x2="350" y2="180" style="stroke:var(--gold)" stroke-width="30" stroke-linecap="round"/>
      <circle cx="350" cy="350" r="26" style="fill:var(--gold)"/>
    </svg></div>
    <div class="txt">
      <div class="lab fade" style="--d:.7s" data-t="0"></div>
      <div class="h gold" style="font-size:300px"><span class="m"><span style="--d:.9s">1<small>시</small></span></span></div>
      <div class="h"><span class="m"><span style="--d:1.2s">까지</span></span></div>
    </div>
  </div>

  <div class="sc mid">
    <div class="h"><span class="m"><span style="--d:0s">강</span></span><span class="m"><span style="--d:.08s">당</span></span><span class="m"><span style="--d:.16s">으</span></span><span class="m"><span style="--d:.24s">로</span></span></div>
    <div class="walk" id="walk"></div>
    <div class="sub fade" style="--d:.6s" data-t="1"></div>
  </div>

  <div class="sc two">
    <div class="art"><div class="devs">
      <div class="ph"></div><div class="tb"></div>
      <svg class="no" viewBox="0 0 700 520"><circle cx="350" cy="270" r="240" fill="none" stroke-width="34"/><path d="M180 100 L520 440" stroke-width="34" stroke-linecap="round"/></svg>
    </div></div>
    <div class="txt">
      <div class="lab fade" style="--d:.4s" data-t="2"></div>
      <div class="h" style="font-size:160px"><span class="m"><span style="--d:.6s">휴대폰</span></span></div>
      <div class="h" style="font-size:160px"><span class="m"><span style="--d:.8s">태블릿PC</span></span></div>
    </div>
  </div>

  <div class="sc two">
    <div class="art"><svg class="book" viewBox="0 0 680 560">
      <path class="cv" d="M30 150 Q190 120 340 160 Q490 120 650 150 L650 520 Q490 490 340 530 Q190 490 30 520 Z" fill="#5a3b24"/>
      <path class="pl" d="M340 150 Q200 105 50 135 L50 495 Q200 465 340 510 Z" fill="#f7f2e6"/>
      <path class="pr" d="M340 150 Q480 105 630 135 L630 495 Q480 465 340 510 Z" fill="#f7f2e6"/>
      <path class="pl" d="M340 150 L340 510 Q300 490 270 480 L270 140 Q305 140 340 150Z" fill="#d9d1bd" opacity=".55"/>
      <path class="pr" d="M340 150 L340 510 Q380 490 410 480 L410 140 Q375 140 340 150Z" fill="#d9d1bd" opacity=".55"/>
      <g stroke="#c9c0a8" stroke-width="10" stroke-linecap="round" id="bl"></g>
      <path class="rb" d="M356 505 L356 560 L370 548 L384 560 L384 500 Z" fill="#c0392b"/>
      <g class="cr"><rect x="320" y="0" width="40" height="120" rx="6"/><rect x="290" y="28" width="100" height="34" rx="6"/></g>
    </svg></div>
    <div class="txt">
      <div class="lab fade" style="--d:.5s" data-t="3"></div>
      <div class="h"><span class="m"><span style="--d:.7s"><span class="hl">성경책</span></span></span></div>
      <div class="h"><span class="m"><span style="--d:.9s">챙기기</span></span></div>
    </div>
  </div>

  <div class="sc sum">
    <div class="k fade" style="--d:0s" data-t="4"></div>
    <div class="l1"><span class="m"><span style="--d:.1s"><span class="gold">1시</span>까지</span></span></div>
    <div class="l2"><span class="m"><span style="--d:.35s">강당으로 이동합니다</span></span></div>
    <div class="rules">
      <div class="r fade" style="--d:.8s"><i>교실에 두고</i><s>휴대폰</s> · <s>태블릿PC</s></div>
      <div class="r fade" style="--d:1s"><i>꼭 챙기기</i>성경책</div>
    </div>
  </div>

  <div class="sc school">
    <div class="emb"><img src="emblem.png" alt="영락고등학교 교표"><div class="ring"></div></div>
    <div class="cap fade" style="--d:1.2s" data-t="5"></div>
    <div class="nm"><span class="gold">영락</span>고등학교</div>
    <div class="ln"></div>
    <div class="en fade" style="--d:2.8s">YOUNGNAK HIGH SCHOOL</div>
  </div>

  <div id="cap"></div>
  <div id="wipe"><i class="b"></i><i class="a"></i></div>
  <div id="bar"></div>
</div>
<script>
// 교시별 판. lab=화면 작은 글씨(장면 1~6), say=목소리 대본(자막). 목소리 파일: voice/v{판}-{장면}.mp3 (없으면 자막만)
var V={
 1:{tr:'rise',mq:['GOOD MORNING','금요 예배'],
    lab:['좋은 아침 · 오늘은 금요 예배','오후 1시까지 모여요','교실에 두고 와요','잊지 말고 꼭','오늘 기억할 것','GOOD MORNING · FRIDAY CHAPEL'],
    say:['좋은 아침이에요! 오늘은 금요일, 예배가 있는 날이에요.','오후 한 시까지 강당으로 모여 주세요.','휴대폰과 태블릿PC는 교실에 두고 와요.','성경책도 잊지 말고 꼭 챙겨 주세요.','기억해요! 한 시, 강당, 휴대폰은 두고, 성경책은 챙기기!','오늘도 힘찬 하루 보내요. 영락고등학교!']},
 2:{tr:'iris',mq:['QUIZ TIME','금요 예배 퀴즈'],
    lab:['Q1. 예배는 몇 시까지?','정답! 1시까지 모두 이동','Q3. 가져가면 안 되는 것','Q4. 꼭 가져갈 것','정답 정리','ALL CLEAR · FRIDAY CHAPEL'],
    say:['퀴즈! 오늘 예배는 몇 시까지 갈까요? 정답, 오후 한 시!','그럼 어디로 가야 할까요? 정답, 강당!','가져가면 안 되는 건? 휴대폰과 태블릿PC!','꼭 가져가야 하는 건? 바로 성경책!','정답 정리! 한 시, 강당, 휴대폰은 두고, 성경책은 챙기기!','다 맞혔나요? 영락고등학교, 강당에서 만나요!']},
 3:{tr:'blind',mq:['CHECK LIST','예배 준비 체크'],

// 판 고르기: ?v=번호(미리보기) 아니면 시각(9시 전 1 · 10시 전 2 · 11시 전 3 · 12시 전 4 · 그 뒤 5)
var q=location.search.match(/[?&]v=(\d)/),now=new Date(),h=now.getHours();
var vn=q&&V[q[1]]?+q[1]:h<9?1:h<10?2:h<11?3:h<12?4:5,C=V[vn],S=document.getElementById('s');
S.className='v'+vn+' tr-'+C.tr;
var W=['일','월','화','수','목','금','토'];
document.getElementById('date').textContent=(now.getMonth()+1)+'.'+now.getDate()+' ('+W[now.getDay()]+')';
function rep(a,b){var t='';for(var k=0;k<5;k++)t+=a+' · '+b+' · ';return t}
document.getElementById('mqa').textContent=rep(C.mq[0],C.mq[1]);
document.getElementById('mqb').textContent=rep('강당 13:00','성경책');
[].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=C.lab[+e.getAttribute('data-t')]});
var NS='http://www.w3.org/2000/svg',g=document.getElementById('ticks');
for(var a=0;a<12;a++){var r=a*Math.PI/6,l=document.createElementNS(NS,'line');
  l.setAttribute('x1',350+250*Math.sin(r));l.setAttribute('y1',350-250*Math.cos(r));l.setAttribute('x2',350+275*Math.sin(r));l.setAttribute('y2',350-275*Math.cos(r));g.appendChild(l);}
var bl=document.getElementById('bl');
for(var y=0;y<7;y++)[90,380].forEach(function(x){var l=document.createElementNS(NS,'line');l.setAttribute('class','tx');
  l.setAttribute('x1',x);l.setAttribute('x2',x+210);l.setAttribute('y1',200+36*y);l.setAttribute('y2',200+36*y);l.style.setProperty('--d',(1.1+.08*y)+'s');bl.appendChild(l);});
var wp=document.getElementById('wipe');
for(var k=0;k<8;k++){var st=document.createElement('i');st.className='st';st.style.setProperty('--i',k);wp.appendChild(st);}
// 발자국
var FOOT='<path d="M30 34C47 34 53 54 48 74C45 88 46 98 42 108C38 119 22 119 19 108C16 97 19 88 15 72C10 52 14 34 30 34Z"/>'+
  '<ellipse cx="13" cy="22" rx="8.5" ry="10"/><ellipse cx="27" cy="13" rx="6" ry="7"/><ellipse cx="38" cy="13" rx="5.5" ry="6.5"/><ellipse cx="47" cy="18" rx="5" ry="6"/><ellipse cx="54" cy="27" rx="4.5" ry="5.5"/>';
var w=document.getElementById('walk');
for(var k=0;k<10;k++){var f=document.createElementNS(NS,'svg');f.setAttribute('viewBox','0 0 60 120');f.innerHTML=FOOT;
  var left=k%2==0;f.style.left=(k*160+60)+'px';f.style.top=(left?-10:50)+'px';
  f.style.transform='rotate(90deg)'+(left?' scaleX(-1)':'');f.style.setProperty('--d',(k*.18)+'s');w.appendChild(f);}
// 칠판 WebView는 innerWidth가 실제보다 커서 clientWidth로 맞춤
function fit(){var e=document.documentElement,X=e.clientWidth,Y=e.clientHeight;if(!X||!Y)return setTimeout(fit,200);
  var k=Math.min(X/1920,Y/1080);S.style.transform='translate('+(X-1920*k)/2+'px,'+(Y-1080*k)/2+'px) scale('+k+')';}
fit();addEventListener('resize',fit);var n=0,t=setInterval(function(){fit();if(++n>9)clearInterval(t)},1000);
// 목소리: 있으면 장면 길이를 목소리에 맞춤. 짝수 바퀴(1·3·5…번째)만 소리 냄 — 10분 내내 반복되면 시끄러워서
var VOICE_EVERY=2,AU=C.say.map(function(_,j){var x=new Audio('voice/v'+vn+'-'+(j+1)+'.mp3');x.preload='auto';x.ok=false;
  x.addEventListener('loadedmetadata',function(){x.ok=isFinite(x.duration)&&x.duration>0});return x;});
var sc=document.querySelectorAll('.sc'),base=[4.5,4,4.5,4.5,7,6.5],i=-1,loop=-1,bar=document.getElementById('bar'),cap=document.getElementById('cap');
function show(){if(i>=0)sc[i].classList.remove('on');i=(i+1)%sc.length;
  if(i==0){loop++;S.classList.toggle('alt',loop%2==1);}
  void sc[i].offsetWidth;sc[i].classList.add('on');
  var say=C.say[i],d=Math.max(base[i],say.length*.16+1.2),au=AU[i];
  cap.textContent=say;cap.classList.add('on');
  if(au.ok&&loop%VOICE_EVERY==0){d=Math.max(base[i],au.duration+1.2);try{au.currentTime=0;var p=au.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition='width '+d+'s linear';bar.style.width='100%';
  setTimeout(next,d*1000);}
function next(){cap.classList.remove('on');wp.classList.remove('go');void wp.offsetWidth;wp.classList.add('go');setTimeout(show,500);}
show();
function tick(){var d=new Date(),m=13*60-(d.getHours()*60+d.getMinutes());
  document.getElementById('left').textContent=m>0?'1시까지 '+(m>=60?Math.floor(m/60)+'시간 ':'')+(m%60)+'분':'지금 강당으로';}
tick();setInterval(tick,15000);
</script>
