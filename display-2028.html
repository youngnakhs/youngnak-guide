<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>2028 대입 내신 가이드 — 공지 디스플레이</title>
<link rel="icon" type="image/svg+xml" href="navigator/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#3cb878; --green2:#2ea865; --green-dk:#1f7a49; --green-lt:#72d4a0;
    --green-pale:#eaf7f1; --bg:#0e2a1d; --surface:#103725; --card:#0f3322;
    --text:#f3fbf6; --text-dim:#bfe4d1; --text-muted:#7fae93; --border:#1f5a3c;
    --early:#5ab0e6; --rise:#f0a93a; --none:#c98fe0; --tba:#7fae93;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif; background:
      radial-gradient(1200px 700px at 80% -10%, #18553575, transparent 60%),
      radial-gradient(900px 600px at 0% 110%, #0c3b2466, transparent 60%),
      var(--bg);
    color:var(--text); overflow:hidden; height:100vh; cursor:none;
  }
  .stage{height:100vh; display:flex; flex-direction:column;}

  /* ── 헤더 ── */
  header{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:clamp(14px,2.2vh,28px) clamp(22px,3.5vw,60px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .tree{font-size:clamp(22px,3vh,34px);}
  .brand b{font-family:'Noto Serif KR',serif; font-weight:900; font-size:clamp(16px,2.4vh,24px); letter-spacing:.5px;}
  .brand span{display:block; font-size:clamp(10px,1.4vh,13px); color:var(--green-lt); letter-spacing:3px; font-weight:700;}
  .clock{text-align:right; font-family:'DM Mono',monospace;}
  .clock .t{font-size:clamp(18px,2.8vh,30px); font-weight:500; letter-spacing:1px;}
  .clock .d{font-size:clamp(10px,1.4vh,13px); color:var(--text-muted);}

  /* ── 슬라이드 본문 ── */
  main{flex:1 1 auto; position:relative; overflow:hidden;}
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:clamp(18px,3vh,40px) clamp(24px,5vw,90px);
    opacity:0; transform:translateY(14px) scale(.995);
    transition:opacity .55s ease, transform .55s ease; pointer-events:none;
  }
  .slide.on{opacity:1; transform:none;}

  .chips{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:clamp(10px,1.8vh,20px);}
  .chip{font-size:clamp(11px,1.5vh,15px); font-weight:700; padding:6px 14px; border-radius:999px; letter-spacing:.5px;}
  .chip.cat{background:#ffffff14; color:var(--text-dim); border:1px solid var(--border);}
  .chip.conf{border:1px solid currentColor;}
  .conf-확정{color:#7fe0a6;} .conf-보도{color:#ffd98a;} .conf-미공개{color:#9fb8ac;}

  .uniname{
    font-family:'Noto Serif KR',serif; font-weight:900;
    font-size:clamp(40px,9vh,108px); line-height:1.04; text-align:center;
    text-shadow:0 4px 30px #0008;
  }
  .subname{font-size:clamp(14px,2.2vh,24px); color:var(--green-lt); font-weight:700; margin-top:6px; letter-spacing:.5px;}

  /* 핵심 정보 행 */
  .facts{
    margin-top:clamp(18px,3.2vh,38px); width:min(1100px,92vw);
    display:flex; flex-direction:column; gap:clamp(8px,1.4vh,14px);
  }
  .fact{
    display:flex; align-items:flex-start; gap:14px;
    background:var(--card); border:1px solid var(--border); border-left:5px solid var(--green);
    border-radius:14px; padding:clamp(12px,1.9vh,20px) clamp(16px,2.4vw,28px);
  }
  .fact .k{flex:0 0 auto; min-width:clamp(86px,11vw,150px); color:var(--green-lt); font-weight:700; font-size:clamp(13px,1.8vh,19px);}
  .fact .v{flex:1; font-size:clamp(15px,2.1vh,23px); font-weight:500; line-height:1.45;}
  .fact .v b{color:#fff; font-weight:900;}

  /* 관리 포인트 배지 */
  .point{
    margin-top:clamp(16px,2.8vh,32px); width:min(1100px,92vw);
    display:flex; align-items:center; gap:16px;
    border-radius:16px; padding:clamp(14px,2.4vh,24px) clamp(18px,2.6vw,30px);
    font-weight:700;
  }
  .point .badge{flex:0 0 auto; font-size:clamp(13px,1.9vh,20px); font-weight:900; padding:8px 16px; border-radius:10px; color:#0e2a1d;}
  .point .txt{font-size:clamp(15px,2.1vh,23px); line-height:1.4;}
  .t-early{background:#5ab0e618; border:1px solid #5ab0e6;}
  .t-early .badge{background:var(--early);} .t-early .txt{color:#d6ecfa;}
  .t-rise{background:#f0a93a18; border:1px solid #f0a93a;}
  .t-rise .badge{background:var(--rise);} .t-rise .txt{color:#fbe6c4;}
  .t-none{background:#c98fe018; border:1px solid var(--none);}
  .t-none .badge{background:var(--none);} .t-none .txt{color:#efddf7;}
  .t-tba{background:#ffffff0d; border:1px solid var(--border);}
  .t-tba .badge{background:var(--tba);} .t-tba .txt{color:var(--text-dim);}

  .tip{margin-top:clamp(12px,2vh,20px); font-size:clamp(14px,1.9vh,21px); color:var(--text-dim); text-align:center; max-width:min(1000px,90vw);}
  .tip b{color:var(--green-lt);}

  /* ── 푸터 ── */
  footer{
    flex:0 0 auto; padding:clamp(8px,1.4vh,16px) clamp(22px,3.5vw,60px);
    border-top:1px solid var(--border); display:flex; align-items:center; gap:18px;
    font-size:clamp(10px,1.3vh,13px); color:var(--text-muted);
  }
  .legend{display:flex; gap:16px; flex-wrap:wrap; flex:1;}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .counter{font-family:'DM Mono',monospace; white-space:nowrap;}
  .progress{position:absolute; left:0; bottom:0; height:4px; background:var(--green); width:0; transition:width 1s linear; box-shadow:0 0 12px var(--green);}
  .disc{flex:0 0 100%; margin-top:6px; color:#5e8a72; font-size:clamp(9px,1.2vh,12px); line-height:1.4;}
</style>
</head>

</div>

  facts:[['전형 구조','교과 중심 정량 · <b>학년 차등 없음</b>'],['종합전형','미래인재 서류형은 정성']]},
];

/* 타입별 기본 안내 문구 */
const POINT = {
  early:{label:'초반·정량형', txt:'1·2학년 <b>석차등급</b>이 곧 합격선. 공통·일반선택 등급을 처음부터 사수!'},
  rise :{label:'상승·정성형', txt:'등급 + <b>생기부</b>(세특·성적 향상·전공 연계 과목)를 함께 평가.'},
  none :{label:'교과전형 미운영', txt:'등급 숫자보다 <b>생기부 전체의 깊이</b>. 3년 내내 정성껏.'},
  tba  :{label:'2028 세부 발표 예정', txt:'정확한 산출식은 2027년 모집요강에서 확정됩니다.'},
};
const TIP = {
  early:'공통·일반선택은 등급 사수 · 진로선택은 전공 따라 도전 · 융합선택은 부담 없이 A!',
  rise :'등급도 챙기고, 세특·전공 연계 과목·성적 향상 흐름으로 \"나의 이야기\"를 만들자!',
  none :'한 과목 한 과목의 활동과 깊이가 쌓여 평가됩니다. 1학년부터 꾸준히!',
  tba  :'발표 전까지는 \"전 학년 등급 안정 + 세특 충실\"이라는 기본기를 다지면 됩니다.',
};

const N = DATA.length;
const main = document.getElementById('main');
const params = new URLSearchParams(location.search);
const sec = parseInt(params.get('sec')||params.get('preview')||'0',10);
const INTERVAL = sec>0 ? sec*1000 : 3600*1000;   // 기본: 1시간마다 / ?sec=10 으로 미리보기
let manual = null, lastTouch = 0, shown = -1;

function unitIndex(){
  const u = sec>0 ? Math.floor(Date.now()/INTERVAL) : Math.floor(Date.now()/3600000);
  return ((u % N)+N)%N;
}
function targetIndex(){
  if(manual!==null && Date.now()-lastTouch < 45000) return manual;
  manual = null;
  return unitIndex();
}
function slideHTML(d){
  const p = POINT[d.type], tip = TIP[d.type];
  const facts = d.facts.map(f=>`<div class="fact"><div class="k">${f[0]}</div><div class="v">${f[1]}</div></div>`).join('');
  return `<div class="slide">
    <div class="chips">
      <span class="chip cat">${d.cat}</span>
      <span class="chip conf conf-${d.conf}">${d.conf}</span>
    </div>
    <div class="uniname">${d.name}</div>
    ${d.sub?`<div class="subname">${d.sub}</div>`:''}
    <div class="facts">${facts}</div>
    <div class="point t-${d.type}"><span class="badge">${p.label}</span><span class="txt">${p.txt}</span></div>
    <div class="tip"><b>고1 TIP ·</b> ${tip}</div>
  </div>`;
}
function render(i){
  const d = DATA[i];
  const el = document.createElement('div');
  el.innerHTML = slideHTML(d);
  const slide = el.firstElementChild;
  // 이전 슬라이드 페이드아웃 후 제거
  [...main.querySelectorAll('.slide')].forEach(s=>{ s.classList.remove('on'); setTimeout(()=>s.remove(),600); });
  main.appendChild(slide);
  requestAnimationFrame(()=>requestAnimationFrame(()=>slide.classList.add('on')));
  document.getElementById('cnt').textContent = (i+1)+' / '+N;
  shown = i;
}
function nav(dir){ manual = ((( (manual===null?unitIndex():manual) + dir)%N)+N)%N; lastTouch = Date.now(); render(manual); }

// 시계 + 진행바 + 전환 체크 (1초 틱)
function tick(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clk').textContent = hh+':'+mm;
  const wd = ['일','월','화','수','목','금','토'][now.getDay()];
  document.getElementById('dat').textContent = `${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()} (${wd})`;
  const frac = (Date.now() % INTERVAL) / INTERVAL;
  document.getElementById('prog').style.width = (manual!==null?0:frac*100)+'%';
  const t = targetIndex();
  if(t !== shown) render(t);
}

// 조작: ←/→ 또는 화면 좌/우 탭, 스페이스
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')nav(1); else if(e.key==='ArrowLeft')nav(-1); });
addEventListener('click',e=>{ nav(e.clientX < innerWidth/2 ? -1 : 1); });

render(unitIndex());
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
