<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영락봇 — 영락고 진로·입시 챗봇</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --kakao-yellow:   #FEE500;
  --kakao-yellow2:  #F5DC00;
  --kakao-bg:       #B2C7D9;
  --kakao-bg2:      #9EB8CC;
  --user-bubble:    #FFEB33;
  --bot-bubble:     #FFFFFF;
  --green:          #3cb878;
  --green-dk:       #1f7a49;
  --text:           #1a1a1a;
  --text-muted:     #666;
  --header-h:       56px;
  --input-h:        56px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; }
body { background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

/* ── Phone frame ── */
.phone-frame {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 900px;
  display: flex;
  flex-direction: column;
  background: var(--kakao-bg);
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,.35);
}
@media (min-width: 440px) {
  .phone-frame {
    border-radius: 28px;
    height: 860px;
  }
}

/* ── Header ── */
.chat-header {
  height: var(--header-h);
  background: var(--kakao-bg2);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(0,0,0,.1);
}
.header-back { font-size: 20px; cursor: pointer; color: var(--text); line-height: 1; }
.header-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header-info { flex: 1; }
.header-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
.header-sub  { font-size: 11px; color: #444; }
.header-icons { display: flex; gap: 14px; font-size: 18px; color: var(--text); }
.header-icons span { cursor: pointer; }

/* ── Chat area ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 4px; }

/* ── Date divider ── */
.date-divider {
  text-align: center;
  margin: 6px 0 10px;
}
.date-divider span {
  background: rgba(0,0,0,.2);
  color: #fff;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
}

/* ── Message rows ── */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  max-width: 82%;
  margin-bottom: 2px;
}
.msg-row.bot  { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.bot-avatar {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; align-self: flex-start;
}

.bubble-col { display: flex; flex-direction: column; gap: 4px; }
.sender-name { font-size: 11px; font-weight: 600; color: #333; padding-left: 2px; }

.bubble {
  padding: 9px 13px;
  border-radius: 4px;
  line-height: 1.55;
  font-size: 14px;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}
.msg-row.bot  .bubble { background: var(--bot-bubble); border-radius: 0 12px 12px 12px; }
.msg-row.user .bubble { background: var(--user-bubble); border-radius: 12px 0 12px 12px; }

.bubble-meta {
  font-size: 10px; color: rgba(0,0,0,.45);
  white-space: nowrap; padding-bottom: 2px;
}
.msg-row.bot  .bubble-meta { align-self: flex-end; }
.msg-row.user .bubble-meta { align-self: flex-end; text-align: right; }

/* cards inside bubble */
.card {
  background: #f7f7f7;
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 6px;
  font-size: 13px;
}
.card-title {
  background: var(--green);
  color: #fff;
  font-weight: 700;
  padding: 7px 12px;
  font-size: 13px;
}
.card-body { padding: 8px 12px; line-height: 1.7; color: #222; }
.card-body b { color: var(--green-dk); }
.card-body a { color: var(--green-dk); text-decoration: underline; }

/* D-Day chip */
.dday-chip {
  display: inline-block;
  background: #fff3cd;
  border: 1.5px solid #f0a500;
  border-radius: 16px;
  padding: 3px 12px;
  font-size: 12px;
  font-weight: 700;
  color: #7a4f00;
  margin-bottom: 8px;
}

/* quick reply chips */
.quick-wrap {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 8px;
}
.quick-btn {
  background: #fff;
  border: 1.5px solid var(--green);
  border-radius: 20px;
  padding: 5px 13px;
  font-size: 12px;
  font-weight: 600;
  color: var(--green-dk);
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
  font-family: 'Noto Sans KR', sans-serif;
}
.quick-btn:hover { background: var(--green); color: #fff; }

/* list-style items */
.item-list { margin: 4px 0; }
.item-list li { margin-left: 16px; line-height: 1.7; color: #222; font-size: 13px; }

/* typing indicator */
.typing-indicator { display: none; }
.typing-indicator .bubble {
  background: var(--bot-bubble);
  border-radius: 0 12px 12px 12px;
  display: flex; gap: 4px; align-items: center;
  padding: 10px 14px;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #aaa;
  animation: bounce 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); }
  40%          { transform: translateY(-6px); }
}

/* ── Quick menu bar (below chat, above input) ── */
.quick-menu-bar {
  background: #c8d8e8;
  border-top: 1px solid rgba(0,0,0,.1);
  padding: 8px 10px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex-shrink: 0;
}
.quick-menu-bar::-webkit-scrollbar { display: none; }
.menu-chip {
  background: #fff;
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .15s;
  font-family: 'Noto Sans KR', sans-serif;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.menu-chip:hover { background: var(--kakao-yellow); }
.menu-chip.active { background: var(--kakao-yellow); }

/* ── Input bar ── */
.input-bar {
  height: var(--input-h);
  background: #c8d8e8;
  border-top: 1px solid rgba(0,0,0,.1);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  flex-shrink: 0;
}
.input-bar .icon-btn {
  width: 32px; height: 32px;
  border: none; background: none;
  font-size: 20px; cursor: pointer; color: #555;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chat-input {
  flex: 1;
  border: none;
  border-radius: 20px;
  background: #fff;
  padding: 8px 14px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  outline: none;
  height: 38px;
}
.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: #aac4d8;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.send-btn.active { background: var(--kakao-yellow); color: #333; }

/* ── Page wrapper for desktop ── */
.page-bg {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--green-dk) 0%, var(--green) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.page-title {
  color: rgba(255,255,255,.85);
  font-size: 13px;
  margin-bottom: 12px;
  letter-spacing: 1px;
  font-weight: 500;
}
</style>
</head>

function getDDay(dateStr) {
  const target = new Date(dateStr);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
  if (diff > 0) return `D-${diff}`;
  if (diff === 0) return 'D-Day';
  return `D+${Math.abs(diff)} (시험 종료)`;
}

let currentRole  = null;

function selectRole(role) {
  currentRole = role;

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'default';
  });

  const area   = document.getElementById('chatArea');
  const typing = document.getElementById('typingIndicator');
  const roleLabel = role === '학생' ? '🎒 학생' : role === '학부모' ? '👨‍👩‍👧 학부모' : '👨‍🏫 교사';

        quick: ROLE_MENUS[role].map(m => m.label),

      area.insertBefore(renderBotMessage(greetData), typing);

function updateMenuBar(role, grade) {

    : ROLE_MENUS[role] || [];

    const btn = document.createElement('button');
    btn.className = 'menu-chip';
    btn.textContent = label;
    btn.onclick = () => sendQuick(topic);
    bar.appendChild(btn);
  });
}

// ── 질문 빈도 추적 (localStorage) ─────────────────────────────
function trackTopic(topic) {
  if (!topic) return;
  try {
    const counts = JSON.parse(localStorage.getItem('ynb_counts') || '{}');
    counts[topic] = (counts[topic] || 0) + 1;
    localStorage.setItem('ynb_counts', JSON.stringify(counts));
  } catch(e) {}
}

function getTopTopics(n = 3) {
  try {
    const counts = JSON.parse(localStorage.getItem('ynb_counts') || '{}');
    return Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, n)
      .map(([topic]) => topic);
  } catch(e) { return []; }
}

// ── Utilities ─────────────────────────────────────────────────
function nowTime() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const hh = h % 12 || 12;
  return `${ampm} ${hh}:${m.toString().padStart(2,'0')}`;
}
function todayFull() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function initTimes() {
  document.getElementById('todayLabel').textContent = todayFull();
  document.getElementById('welcomeTime').textContent = nowTime();

  // 웰컴 메시지에 D-Day 칩 삽입
  const chip = document.getElementById('ddayWelcome');
  if (chip) {
    chip.innerHTML = `<span class="dday-chip">🗓️ 2027학년도 수능 ${DDAY_STR}</span><br>`;
  }
}

function scrollBottom() {
  const area = document.getElementById('chatArea');
  area.scrollTop = area.scrollHeight;
}

// ── Render helpers ────────────────────────────────────────────
function renderBotMessage(data, isGradeAsk) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  const avatar = document.createElement('div');
  avatar.className = 'bot-avatar';
  avatar.textContent = '🏫';

  const col = document.createElement('div');
  col.className = 'bubble-col';

  const name = document.createElement('div');
  name.className = 'sender-name';
  name.textContent = '영락봇';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (data.text) {
    const t = document.createElement('span');
    t.textContent = data.text;
    bubble.appendChild(t);
  }

  (data.cards || []).forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const ct = document.createElement('div');
    ct.className = 'card-title';
    ct.textContent = c.title;
    const cb = document.createElement('div');
    cb.className = 'card-body';
    cb.innerHTML = c.body.replace(/\n/g, '<br>');
    card.appendChild(ct);
    card.appendChild(cb);
    bubble.appendChild(card);
  });

  if (data.quick && data.quick.length) {
    const qw = document.createElement('div');
    qw.className = 'quick-wrap';
    data.quick.forEach(q => {
      const btn = document.createElement('button');
      btn.className = isGradeAsk ? 'quick-btn grade-btn' : 'quick-btn';
      btn.textContent = q;
      btn.onclick = isGradeAsk ? () => selectGrade(q) : () => sendQuick(q);
      qw.appendChild(btn);
    });
    bubble.appendChild(qw);
  }

  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  meta.textContent = nowTime();

  col.appendChild(name);
  col.appendChild(bubble);
  col.appendChild(meta);
  row.appendChild(avatar);
  row.appendChild(col);

  return row;
}

function renderUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const col = document.createElement('div');
  col.className = 'bubble-col';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  meta.textContent = nowTime();
  col.appendChild(bubble);
  col.appendChild(meta);
  row.appendChild(col);
  return row;
}

// ── Logic ────────────────────────────────────────────────────
function findTopic(input) {
  const s = input.trim().replace(/📋|📊|📚|🗓️|🏫|❓|🔍|📖|📞|📄|👨‍🏫|👨‍👩‍👧|🎒/g, '').trim();

  // 역할별 KB 우선 검색
  if (currentRole === '학부모' && KB_PARENT[s]) return s;
  if (currentRole === '교사'   && KB_TEACHER[s]) return s;
  if (KB[s]) return s;

  // 학부모·교사 KB 전체 키 직접 매칭
  if (KB_PARENT[s]) return s;
  if (KB_TEACHER[s]) return s;

  const MAP = {
    '입시 정보': '입시 정보', '성적 상담': '성적 상담',
    '과목 선택': '과목 선택', '수능 일정': '수능 일정',
    '학교 소개': '학교 소개', '도움말': '도움말'
  };
  if (MAP[s]) return MAP[s];

  for (const {keys, topic} of KEYWORD_MAP) {
    for (const k of keys) {
      if (s.toLowerCase().includes(k.toLowerCase())) return topic;
    }
  }
  return null;
}

function getReply(topic) {
  // 역할별 KB → 공통 KB 순서로 탐색
  if (currentRole === '학부모' && KB_PARENT[topic]) return KB_PARENT[topic];
  if (currentRole === '교사'   && KB_TEACHER[topic]) return KB_TEACHER[topic];
  if (KB[topic]) return KB[topic];
  if (KB_PARENT[topic]) return KB_PARENT[topic];
  if (KB_TEACHER[topic]) return KB_TEACHER[topic];

  // 역할별 기본 안내 메시지
  const fallbackQuick = currentRole === '학부모'
    ? ['수시·정시 차이', '입시 용어 설명', '자녀 성적 해석', '📞 상담 신청']
    : currentRole === '교사'
    ? ['성적 분석 도구', '입시 탐색', '교육과정 안내', '상담 자료']
    : ['📋 입시 정보', '📊 성적 상담', '📚 과목 선택', '❓ 도움말'];

  return {
    text: '죄송해요, 해당 내용은 아직 준비 중이에요 😅\n아래 메뉴에서 선택해 주시거나 담임 선생님께 문의해 주세요.',
    cards: [],
    quick: fallbackQuick,
  };
}

function appendBotReply(topic) {
  trackTopic(topic);

  const typing = document.getElementById('typingIndicator');
  typing.style.display = 'flex';
  scrollBottom();

  setTimeout(() => {
    typing.style.display = 'none';

    // 도움말: 자주 찾는 질문 동적 삽입
    let data = getReply(topic);
    if (topic === '도움말') {
      const tops = getTopTopics(3);
      if (tops.length > 0) {
        data = JSON.parse(JSON.stringify(data)); // 얕은 복사
        data.cards[0].body += `\n\n<b>이 기기에서 자주 찾는 질문 TOP ${tops.length}</b>\n  ${tops.map((t, i) => `${i+1}. ${t}`).join('\n  ')}`;
      }
    }

    const area = document.getElementById('chatArea');
    const node = renderBotMessage(data);
    area.insertBefore(node, typing);
    scrollBottom();
  }, 600 + Math.random() * 400);
}

function sendMessage(text) {
  if (!text.trim()) return;
  const area = document.getElementById('chatArea');
  const typing = document.getElementById('typingIndicator');
  area.insertBefore(renderUserMessage(text), typing);
  scrollBottom();

  const topic = findTopic(text);
  appendBotReply(topic);
}

function sendQuick(label) {
  document.getElementById('chatInput').value = '';
  updateSendBtn();
  sendMessage(label);
}

function handleSend() {
  const inp = document.getElementById('chatInput');
  const v = inp.value.trim();
  if (!v) return;
  inp.value = '';
  updateSendBtn();
  sendMessage(v);
}

function onInputChange() { updateSendBtn(); }
function updateSendBtn() {
  const v = document.getElementById('chatInput').value.trim();
  const btn = document.getElementById('sendBtn');
  btn.disabled = !v;
  btn.classList.toggle('active', !!v);
}
function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
}

// ── Init ─────────────────────────────────────────────────────
initTimes();
</script>
</body>
</html>
