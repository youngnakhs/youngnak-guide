<!DOCTYPE html>
<html lang="ko" data-palette="slate" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EEF2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>영락봇 — 진로·입시 챗봇</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
html, body { overscroll-behavior: none; }

body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px; line-height: 1.5; color: var(--text);
  background: var(--p-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  overflow: hidden;
  transition: background-color .6s ease;
  -webkit-tap-highlight-color: transparent;
}

/* ── Slate (default light) ──────────────────────────────── */
html[data-palette="slate"] {
  --p-bg: #E3E7EE;
  --p-bg-grad-2: rgba(100, 130, 200, 0.18);
  --p-bg-grad-3: rgba(50, 70, 150, 0.10);

  --surface: #EEF2F7;
  --card-bg: #FFFFFF;
  --bubble-edge: rgba(15, 23, 42, 0.02);
  --text: #0F172A;
  --text-secondary: #334155;
  --text-muted: #64748B;
  --text-faint: #94A3B8;
  --border: rgba(15, 23, 42, 0.10);
  --border-strong: rgba(15, 23, 42, 0.20);
  --hover: rgba(15, 23, 42, 0.04);
  --active: rgba(15, 23, 42, 0.08);
  --scrollbar: rgba(15, 23, 42, 0.15);

  --accent: #2563EB;
  --accent-on: #FFFFFF;
  --accent-shadow: rgba(37, 99, 235, 0.25);
  --accent-soft: rgba(37, 99, 235, 0.05);
  --accent-soft-border: rgba(37, 99, 235, 0.20);

  --user-bubble: #1E40AF;
  --user-text: #F1F5F9;
  --bot-bubble: #FFFFFF;

  --chip-bg: #FFFFFF;
  --chip-border: rgba(15, 23, 42, 0.10);
  --chip-hover: rgba(37, 99, 235, 0.06);
  --chip-hover-border: rgba(37, 99, 235, 0.25);

  --avatar-bg: rgba(37, 99, 235, 0.12);

  --input-bg: #E3E8F0;
  --input-bg-focus: #FFFFFF;
  --send-bg: rgba(15, 23, 42, 0.08);
  --send-color: rgba(15, 23, 42, 0.4);

  --dday-bg: rgba(37, 99, 235, 0.05);
  --dday-border: rgba(37, 99, 235, 0.20);
  --dday-text: #1E3A8A;

  --overlay-bg: rgba(248, 250, 252, 0.7);

  --status-online: #22C55E;
  --status-online-glow: rgba(34, 197, 94, 0.20);
}

/* ── Page background (desktop decoration) ──────────────── */
.stage {
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--p-bg-grad-2) 0%, transparent 60%),
    radial-gradient(80% 60% at 50% 100%, var(--p-bg-grad-3) 0%, transparent 70%),
    var(--p-bg);
}

/* ── Chat shell: mobile-first full screen ───────────────── */
.chat-shell {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  height: 100dvh;
  width: 100vw;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  overflow: hidden;
}

/* ── Desktop: centered card (≥640px) ────────────────────── */
@media (min-width: 640px) {
  body { overflow: hidden; }
  .chat-shell {
    position: relative;
    inset: auto;
    margin: 24px auto;
    width: 100%;
    max-width: 480px;
    height: min(900px, calc(100dvh - 48px));
    border-radius: 28px;
    box-shadow:
      0 0 0 1px rgba(15, 23, 42, 0.06),
      0 30px 60px -20px rgba(15, 23, 42, 0.25),
      0 16px 32px -12px rgba(15, 23, 42, 0.10);
    padding-top: 0;
    overflow: hidden;
  }
}

/* ── Header ─────────────────────────────────────────────── */
.header {
  flex: 0 0 auto;
  height: 60px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 8px 0 4px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  z-index: 3;
}
.header-info { flex: 1; min-width: 0; padding-left: 2px; }
.header-name {
  font-size: 15px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 7px; line-height: 1.2;
  letter-spacing: -0.015em;
}
.header-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--status-online);
  box-shadow: 0 0 0 2.5px var(--status-online-glow);
}
.header-sub {
  font-size: 12px; color: var(--text-muted);
  margin-top: 2px; letter-spacing: -0.01em; font-weight: 500;
}

.icon-btn {
  width: 44px; height: 44px; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; border-radius: 12px;
  transition: background-color .15s ease, color .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:active { background: var(--active); }
.icon-btn.ghost { color: var(--text-faint); }

/* ── Chat body ──────────────────────────────────────────── */
.chat-body {
  flex: 1 1 auto; overflow-y: auto;
  padding: 18px 16px 20px;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar) transparent;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.chat-body::-webkit-scrollbar { width: 4px; }
.chat-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

.date-divider { text-align: center; padding: 4px 0 2px; }
.date-divider span {
  font-size: 11px; color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.02em;
}

/* ── Message rows ───────────────────────────────────────── */
.row { display: flex; gap: 8px; max-width: 92%; align-items: flex-start; }
.row.bot { align-self: flex-start; }
.row.user { align-self: flex-end; flex-direction: row-reverse; }
.row .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 0 1 auto; }
.row.user .col { align-items: flex-end; }
.row.bot > div:first-child { margin-top: 16px; }

.sender { font-size: 11px; color: var(--text-faint); font-weight: 500; padding-left: 2px; }
.meta {
  font-size: 10.5px; color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  padding: 0 2px; white-space: nowrap;
}
.row.user .meta { text-align: right; }

/* ── Bubbles ────────────────────────────────────────────── */
.bubble {
  padding: 11px 14px;
  font-size: 14.5px; line-height: 1.6;
  border-radius: 18px; word-break: break-word; position: relative;
}
.bubble-text { white-space: pre-line; }
.bubble-text b, .info-body b { font-weight: 600; color: var(--text); }

.bot-bubble {
  background: var(--bot-bubble); color: var(--text);
  border: 0.5px solid var(--border);
  border-bottom-left-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.user-bubble {
  background: var(--user-bubble); color: var(--user-text);
  border-bottom-right-radius: 6px;
}

.typing-bubble { padding: 13px 16px; }
.typing { display: flex; gap: 4px; align-items: center; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint);
  animation: ty 1.3s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes ty {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); background: var(--accent); }
}

/* ── Info card ──────────────────────────────────────────── */
.info-card {
  margin-top: 10px;
  padding: 14px 14px 16px;
  background: var(--card-bg);
  border-radius: 14px;
  border: 0.5px solid var(--border);
}
.info-kicker {
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 6px;
}
.info-title {
  font-size: 15px; font-weight: 600;
  color: var(--text); letter-spacing: -0.015em;
  margin-bottom: 10px; line-height: 1.35;
}
.info-rule { height: 0.5px; background: var(--border); margin: 0 -14px 12px; }
.info-body {
  font-size: 13.5px; line-height: 1.7; color: var(--text-secondary);
  white-space: pre-line; font-variant-numeric: tabular-nums;
}
.card-link-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px; padding: 9px 14px;
  background: var(--accent); color: var(--accent-on);
  border-radius: 10px;
  font-size: 13px; font-weight: 600;
  text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 0 2px 6px var(--accent-shadow);
  min-height: 38px;
}
.card-link-btn:active { transform: translateY(1px); }
.card-link-btn:hover { box-shadow: 0 4px 12px var(--accent-shadow); }

/* ── D-Day chip ─────────────────────────────────────────── */
.dday-chip {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 10px 0 2px;
  padding: 6px 12px 6px 10px;
  border-radius: 100px;
  background: var(--dday-bg);
  border: 0.5px solid var(--dday-border);
  font-size: 12px; font-weight: 500;
  color: var(--dday-text); white-space: nowrap;
}
.dday-chip svg { color: var(--accent); }
.dday-num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600; color: var(--accent);
  letter-spacing: 0.02em;
}

/* ── Quick chips ────────────────────────────────────────── */
.chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip {
  background: var(--chip-bg);
  border: 0.5px solid var(--chip-border);
  color: var(--text);
  font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 8px 14px; border-radius: 100px;
  cursor: pointer; letter-spacing: -0.01em;
  white-space: nowrap;
  transition: all .15s ease;
  min-height: 36px;
}
.chip:hover {
  background: var(--chip-hover);
  border-color: var(--chip-hover-border);
  color: var(--accent);
}
.chip:active { transform: translateY(1px); }
.chip:disabled { opacity: .5; cursor: default; }

/* ── Role picker ────────────────────────────────────────── */
.block-pad { padding: 4px 0 4px 40px; }
.role-picker { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
.role-card {
  background: var(--card-bg);
  border: 0.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  display: grid; grid-template-columns: 1fr auto;
  align-items: center;
  cursor: pointer;
  font-family: inherit; color: var(--text);
  text-align: left;
  transition: all .15s ease;
  min-height: 56px;
}
.role-card:hover {
  border-color: var(--accent-soft-border);
  background: var(--accent-soft);
}
.role-card:active { transform: translateY(1px); }
.role-name { font-size: 14.5px; font-weight: 600; color: var(--text); }
.role-sub {
  grid-column: 1 / 2;
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
}
.role-arrow { grid-column: 2; grid-row: 1 / 3; color: var(--text-faint); display: flex; align-items: center; }
.role-card:hover .role-arrow { color: var(--accent); }

/* ── Recommended carousel ───────────────────────────────── */
.rec-wrap { padding: 4px 0 4px 40px; max-width: 100%; }
.rec-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
}
.rec-head svg { color: var(--accent); }
.rec-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  margin-right: -16px; padding-right: 16px;
  -webkit-overflow-scrolling: touch;
}
.rec-scroll::-webkit-scrollbar { display: none; }
.rec-card {
  flex: 0 0 auto; width: 158px;
  scroll-snap-align: start;
  background: var(--card-bg);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px 12px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  position: relative;
  transition: all .15s ease;
  min-height: 76px;
}
.rec-card:hover {
  border-color: var(--accent-soft-border);
  background: var(--accent-soft);
}
.rec-tag {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 8px;
}
.rec-title {
  font-size: 13px; font-weight: 500;
  color: var(--text); line-height: 1.35;
  letter-spacing: -0.015em;
  padding-right: 18px;
}
.rec-arrow { position: absolute; right: 12px; bottom: 12px; color: var(--text-faint); }

/* ── Menu bar ───────────────────────────────────────────── */
.menubar {
  flex: 0 0 auto;
  border-top: 0.5px solid var(--border);
  background: var(--surface);
  padding: 10px 0;
}
.menubar-scroll {
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; padding: 0 14px;
  -webkit-overflow-scrolling: touch;
}
.menubar-scroll::-webkit-scrollbar { display: none; }
.menu-chip {
  flex: 0 0 auto;
  background: var(--chip-bg);
  border: 0.5px solid var(--chip-border);
  color: var(--text);
  font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 9px 14px; border-radius: 100px;
  cursor: pointer; letter-spacing: -0.01em;
  white-space: nowrap;
  transition: all .15s ease;
  min-height: 38px;
}
.menu-chip:hover {
  background: var(--chip-hover);
  border-color: var(--chip-hover-border);
  color: var(--accent);
}
.menu-chip-nav {
  background: transparent;
  border: 0.5px dashed var(--border);
  color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 4px;
}
.menu-chip-nav:hover {
  border-style: solid;
  border-color: var(--border-strong);
  color: var(--text);
  background: var(--hover);
}

/* ── Composer ───────────────────────────────────────────── */
.composer {
  flex: 0 0 auto;
  border-top: 0.5px solid var(--border);
  background: var(--surface);
  padding: 10px 8px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 6px;
}
.input-wrap {
  flex: 1; display: flex; align-items: center;
  background: var(--input-bg);
  border: 0.5px solid var(--border);
  border-radius: 22px;
  padding: 0 14px;
  transition: border-color .15s ease, background-color .15s ease;
}
.input-wrap:focus-within {
  border-color: var(--accent);
  background: var(--input-bg-focus);
}
.input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 16px;
  color: var(--text); padding: 12px 0;
  letter-spacing: -0.01em;
  min-height: 24px;
}
.input::placeholder { color: var(--text-faint); }
.input:disabled { cursor: not-allowed; }

.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: none; cursor: pointer;
  background: var(--send-bg);
  color: var(--send-color);
  display: flex; align-items: center; justify-content: center;
  transition: all .2s ease;
  flex-shrink: 0;
}
.send-btn.active {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 4px 10px var(--accent-shadow);
}
.send-btn.active:hover { transform: scale(1.04); }
.send-btn:disabled { cursor: default; }

/* ── Search overlay ─────────────────────────────────────── */
.search-overlay {
  position: absolute; inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.search-overlay.open { opacity: 1; pointer-events: auto; }
.search-sheet {
  position: absolute; top: 60px; left: 0; right: 0;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 12px 14px 14px;
  transform: translateY(-6px); opacity: 0;
  transition: transform .25s ease, opacity .25s ease;
}
.search-overlay.open .search-sheet { transform: translateY(0); opacity: 1; }
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--input-bg);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 0 10px 0 12px;
  color: var(--text-muted);
}
.search-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 16px;
  color: var(--text); padding: 11px 0;
}
.search-input::placeholder { color: var(--text-faint); }
.search-hint {
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  padding: 14px 4px 8px;
}
.search-list { display: flex; flex-direction: column; max-height: 50dvh; overflow-y: auto; scrollbar-width: none; }
.search-list::-webkit-scrollbar { display: none; }
.search-row {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 6px;
  background: transparent; border: none;
  border-bottom: 0.5px solid var(--border);
  font-family: inherit; cursor: pointer;
  text-align: left; color: var(--text);
  transition: background-color .12s ease;
  min-height: 50px;
}
.search-row:hover { background: var(--hover); }
.search-row:last-child { border-bottom: none; }
.search-row-main { flex: 1; min-width: 0; }
.search-row-label { font-size: 14px; font-weight: 500; color: var(--text); }
.search-row-sum {
  font-size: 12px; color: var(--text-muted);
  margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.search-row-tag {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
}
.search-empty { text-align: center; padding: 40px 0; font-size: 13px; color: var(--text-faint); line-height: 1.6; }

/* ── Animations ─────────────────────────────────────────── */
.anim-in { animation: msg-in .35s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes msg-in {
  from { transform: translateY(6px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<script type="text/babel" data-presets="env,react">
// ============ data.jsx — Knowledge base ============
const SUNEUNG_DATE = '2026-11-19';

function getDDay(dateStr) {
  const target = new Date(dateStr);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
  if (diff > 0) return `D-${diff}`;
  if (diff === 0) return 'D-Day';
  return `D+${Math.abs(diff)}`;
}
const DDAY_STR = getDDay(SUNEUNG_DATE);

const KB = {
  '입시 정보': {
    text: '입시 전형에 대해 안내해 드릴게요. 어떤 내용이 궁금하세요?',
    quick: ['수시 전형', '정시 전형', '학생부 관리', '자기소개서 팁'],
  },
  '수시 전형': {
    cards: [{

function renderRich(text) {
  if (!text) return null;
  const parts = text.split(/\*\*(.+?)\*\*/g);

      : <b key={i}>{p}</b>
  );
}

function nowTime() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h < 12 ? '오전' : '오후';
  const hh = h % 12 || 12;
  return `${ampm} ${hh}:${m.toString().padStart(2, '0')}`;

function todayFull() {
  const d = new Date();
  const days = ['일', '월', '화', '수', '목', '금', '토'];

}

function stripEmoji(s) {
  return s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
}

function findTopic(input, role) {
  const s = stripEmoji(input).trim();
  if (!s) return null;
  if (role === '학부모' && KB_PARENT[s]) return s;
  if (role === '교사' && KB_TEACHER[s]) return s;
  if (KB[s]) return s;
  if (KB_PARENT[s]) return s;
  if (KB_TEACHER[s]) return s;
  for (const { keys, topic } of KEYWORD_MAP) {
    for (const k of keys) {
      if (s.toLowerCase().includes(k.toLowerCase())) return topic;
    }
  }
  return null;
}

    ? ['수시·정시 차이', '입시 용어 설명', '자녀 성적 해석', '상담 신청']
    : role === '교사'
      ? ['성적 분석 도구', '입시 탐색', '교육과정 안내', '상담 자료']
      : ['입시 정보', '성적 상담', '선택과목 안내', '도움말'];
  return {
    text: '죄송해요, 해당 내용은 아직 준비 중이에요.\n아래 메뉴에서 선택하시거나 담임 선생님께 문의해 주세요.',
    quick: fallbackQuick,
  };
}

const DDayChip = () => (
  <div className="dday-chip">
    <Icon name="calendar" size={13} stroke={1.8}/>
    <span>2027 수능</span>
    <span className="dday-num">{DDAY_STR}</span>
  </div>
);

const InfoCard = ({ title, kicker, body, link }) => (
  <div className="info-card">
    {kicker && <div className="info-kicker">{kicker}</div>}
    <div className="info-title">{title}</div>
    <div className="info-rule"/>
    <div className="info-body">{renderRich(body)}</div>
    {link && (
      <a className="card-link-btn"
         href={link.href}
         target="_blank"
         rel="noopener noreferrer"
         aria-label={link.label || '자세히 보기'}>
        <span>{link.label || '자세히 보기'}</span>
        <Icon name="external" size={14} stroke={2}/>
      </a>
    )}
  </div>
);

const QuickChips = ({ items, onPick, disabled }) => (
  <div className="chip-wrap">
    {items.map((q, i) => (
      <button key={i} className="chip" disabled={disabled} onClick={() => onPick(q)}>
        {q}
      </button>
    ))}
  </div>
);

const TypingDots = () => (
  <div className="typing"><span/><span/><span/></div>
);

const BotRow = ({ msg, onPick, locked }) => (
  <div className="row bot anim-in">
    <BotAvatar size={32}/>
    <div className="col">
      <div className="sender">영락봇</div>
      <div className={`bubble bot-bubble ${msg.compact ? 'compact' : ''}`}>
        {msg.text && <div className="bubble-text">{renderRich(msg.text)}</div>}
        {msg.dday && <DDayChip/>}
        {(msg.cards || []).map((c, i) => (
          <InfoCard key={i} {...c}/>
        ))}
        {msg.quick && msg.quick.length > 0 && (
          <QuickChips
            items={msg.quick}
            onPick={(q) => !locked && onPick(q, msg.kind)}
            disabled={locked}
          />
        )}
      </div>
      <div className="meta">{msg.time}</div>
    </div>
  </div>
);

const UserRow = ({ msg }) => (
  <div className="row user anim-in">
    <div className="col">
      <div className="bubble user-bubble">
        <div className="bubble-text">{msg.text}</div>
      </div>
      <div className="meta">{msg.time}</div>
    </div>
  </div>
);

const RecCarousel = ({ items, onPick }) => (
  <div className="rec-wrap">
    <div className="rec-head">
      <Icon name="sparkle" size={12} stroke={2}/>
      <span>추천 질문</span>
    </div>
    <div className="rec-scroll">
      {items.map((it, i) => (
        <button className="rec-card" key={i} onClick={() => onPick(it.topic)}>
          <div className="rec-tag">{it.tag}</div>
          <div className="rec-title">{it.title}</div>
          <div className="rec-arrow"><Icon name="arrow" size={14} stroke={1.6}/></div>
        </button>
      ))}
    </div>
  </div>
);

const ChatHeader = ({ role, grade, onBack, onSearch }) => {
  const subtitle = role
    ? (grade ? `${role} · ${grade}` : `${role} · 응답 가능`)
    : '진로·입시 챗봇 · 응답 가능';
  return (
    <div className="header">
      <button className="icon-btn" onClick={onBack} aria-label="처음으로">
        <Icon name="back" size={22} stroke={1.7}/>
      </button>
      <BotAvatar size={36}/>
      <div className="header-info">
        <div className="header-name">영락봇<span className="header-dot"/></div>
        <div className="header-sub">{subtitle}</div>
      </div>
      <button className="icon-btn" onClick={onSearch} aria-label="검색">
        <Icon name="search" size={20}/>
      </button>
    </div>
  );
};

const MenuBar = ({ items, onPick, onReset, onBack, showBack }) => (
  <div className="menubar">
    <div className="menubar-scroll">
      {items.map((m, i) => (
        <button key={i} className="menu-chip" onClick={() => onPick(m.topic)}>
          {m.label}
        </button>
      ))}
      {showBack && (
        <button className="menu-chip menu-chip-nav" onClick={onBack}>
          학년 변경
        </button>
      )}
      <button className="menu-chip menu-chip-nav" onClick={onReset}>
        <Icon name="reset" size={12} stroke={2}/>
        <span>처음으로</span>
      </button>
    </div>
  </div>
);

const RolePicker = ({ onPick }) => (
  <div className="role-picker">
    {[
      { id: '학생', sub: '입시·성적·과목' },
      { id: '학부모', sub: '용어·성적 해석·상담' },
      { id: '교사', sub: '진학부 도구·자료' },
    ].map((r) => (
      <button key={r.id} className="role-card" onClick={() => onPick(r.id)}>
        <div className="role-name">{r.id}</div>
        <div className="role-sub">{r.sub}</div>
        <div className="role-arrow"><Icon name="arrow" size={14}/></div>
      </button>
    ))}
  </div>
);

const Composer = ({ value, onChange, onSend, disabled, placeholder }) => {
  const ref = useRef(null);
  const can = value.trim().length > 0 && !disabled;
  return (
    <div className="composer">
      <div className="input-wrap">
        <input
          ref={ref}
          className="input"
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              if (can) onSend();
            }
          }}
          disabled={disabled}
        />
      </div>
      <button className={`send-btn ${can ? 'active' : ''}`} disabled={!can} onClick={onSend} aria-label="보내기">
        <Icon name="send" size={18} stroke={2}/>
      </button>
    </div>
  );
};

function buildSearchIndex(role) {
  const out = [];
  const add = (key, src, srcLabel) => {
    const v = src[key];
    const summary = v.cards?.[0]?.title || v.text || '';
    out.push({ key, label: key, summary, scope: srcLabel });
  };
  Object.keys(KB).forEach(k => add(k, KB, '공통'));
  if (role === '학부모') Object.keys(KB_PARENT).forEach(k => add(k, KB_PARENT, '학부모'));
  if (role === '교사') Object.keys(KB_TEACHER).forEach(k => add(k, KB_TEACHER, '교사'));
  return out;
}

const SearchOverlay = ({ open, onClose, onPick, role }) => {
  const [q, setQ] = useState('');
  const inputRef = useRef(null);
  const idx = useMemo(() => buildSearchIndex(role), [role]);

  useEffect(() => {
    if (open) {
      setQ('');
      setTimeout(() => inputRef.current?.focus(), 80);
    }
  }, [open]);

  const results = q.trim()
    ? idx.filter(i =>
        i.label.toLowerCase().includes(q.toLowerCase()) ||
        (i.summary && i.summary.toLowerCase().includes(q.toLowerCase()))
      )
    : idx.slice(0, 10);

  return (
    <div className={`search-overlay ${open ? 'open' : ''}`} onClick={onClose}>
      <div className="search-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="search-bar">
          <Icon name="search" size={18}/>
          <input
            ref={inputRef}
            className="search-input"
            placeholder="주제·키워드 검색"
            value={q}
            onChange={(e) => setQ(e.target.value)}
          />
          <button className="icon-btn" onClick={onClose} aria-label="닫기">
            <Icon name="close" size={18}/>
          </button>
        </div>
        <div className="search-hint">
          {q.trim() ? `${results.length}개 결과` : '추천 주제'}
        </div>
        <div className="search-list">
          {results.map((r, i) => (
            <button key={i} className="search-row" onClick={() => { onPick(r.label); onClose(); }}>
              <div className="search-row-main">
                <div className="search-row-label">{r.label}</div>
                {r.summary && <div className="search-row-sum">{r.summary}</div>}
              </div>
              <div className="search-row-tag">{r.scope}</div>
            </button>
          ))}
          {results.length === 0 && (
            <div className="search-empty">검색 결과가 없어요.<br/>다른 키워드로 시도해 보세요.</div>
          )}
        </div>
      </div>
    </div>
  );
};

function ChatApp() {
  const [role, setRole] = useState(null);
  const [grade, setGrade] = useState(null);
  const [msgs, setMsgs] = useState([]);
  const [typing, setTyping] = useState(false);
  const [input, setInput] = useState('');
  const [search, setSearch] = useState(false);
  const [todayLabel] = useState(todayFull());
  const scrollerRef = useRef(null);
  const lock = useRef(false);

  useEffect(() => {
    setMsgs([{
      who: 'bot',
      kind: 'welcome',
      text: '안녕하세요. 영락고 진로·입시 챗봇 영락봇이에요.\n먼저 본인이 누구인지 알려주세요.',
      dday: true,
      time: nowTime(),
    }]);
  }, []);

  useLayoutEffect(() => {
    const el = scrollerRef.current;
    if (!el) return;
    el.scrollTop = el.scrollHeight;
  }, [msgs, typing]);

  const pushBot = (m) => setMsgs((prev) => [...prev, { who: 'bot', time: nowTime(), ...m }]);
  const pushUser = (text) => setMsgs((prev) => [...prev, { who: 'user', text, time: nowTime() }]);

  const replyTopic = (topic) => {
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      const d = getReply(topic, role);
      pushBot({ text: d.text, cards: d.cards, quick: d.quick, kind: 'reply' });
    }, 500 + Math.random() * 200);
  };

  const sendText = (text) => {
    if (!text.trim() || lock.current) return;
    pushUser(text);
    const topic = findTopic(text, role);
    if (topic) {
      replyTopic(topic);
    } else {
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        const fallbackQuick = role === '학부모'
          ? ['수시·정시 차이', '입시 용어 설명', '자녀 성적 해석', '상담 신청']
          : role === '교사'
            ? ['성적 분석 도구', '입시 탐색', '교육과정 안내', '상담 자료']
            : ['입시 정보', '성적 상담', '선택과목 안내', '도움말'];
        pushBot({
          text: '잘 이해하지 못했어요. 아래 메뉴에서 골라보시거나 키워드로 다시 입력해 주세요.',
          quick: fallbackQuick,
        });
      }, 450);
    }
  };

  const pickRole = (r) => {
    setRole(r);
    pushUser(r);
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      if (r === '학생') {
        pushBot({ text: '몇 학년이에요?', quick: ['1학년', '2학년', '3학년'], kind: 'gradeAsk' });
      } else {
        pushBot({
          text: ROLE_GREET[r],
          quick: ROLE_MENUS[r].map(m => m.label),
          kind: 'greet',
          showRec: true,
        });
      }
    }, 450);
  };

  const pickGrade = (g) => {
    setGrade(g);
    pushUser(g);
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      pushBot({
        text: GRADE_GREET[g],
        quick: GRADE_MENUS[g].map(m => m.label),
        kind: 'greet',
        showRec: true,
      });
    }, 500);
  };

  const handlePick = (q, fromKind) => {
    if (fromKind === 'gradeAsk' && ['1학년', '2학년', '3학년'].includes(q)) {
      pickGrade(q);
      return;
    }
    if (!role && ['학생', '학부모', '교사'].includes(q)) {
      pickRole(q);
      return;
    }
    pushUser(q);
    const topic = findTopic(q, role);
    if (topic) replyTopic(topic);
    else replyTopic('도움말');
  };

  const handleReset = () => {
    setRole(null);
    setGrade(null);
    setMsgs([{
      who: 'bot', kind: 'welcome',
      text: '안녕하세요. 영락고 진로·입시 챗봇 영락봇이에요.\n먼저 본인이 누구인지 알려주세요.',
      dday: true, time: nowTime(),
    }]);
  };

  const handleBackGrade = () => {
    setGrade(null);
    pushBot({
      text: '학년을 다시 선택해 주세요.',
      quick: ['1학년', '2학년', '3학년'],
      kind: 'gradeAsk',
    });
  };

  const menuItems = role && grade ? GRADE_MENUS[grade]
                  : role ? ROLE_MENUS[role]
                  : null;
  const recItems = role ? RECOMMENDED[role] : null;

  return (
    <div className="chat-shell">
      <ChatHeader
        role={role} grade={grade}
        onBack={handleReset}
        onSearch={() => setSearch(true)}
      />
      <div className="chat-body" ref={scrollerRef}>
        <div className="date-divider"><span>{todayLabel}</span></div>
        {msgs.map((m, i) => (
          m.who === 'bot'
            ? <React.Fragment key={i}>
                <BotRow msg={m} onPick={handlePick} locked={lock.current}/>
                {m.kind === 'welcome' && i === msgs.length - 1 && !role && (
                  <div className="block-pad"><RolePicker onPick={pickRole}/></div>
                )}
                {m.showRec && i === msgs.length - 1 && recItems && (
                  <RecCarousel items={recItems} onPick={(t) => handlePick(t)}/>
                )}
              </React.Fragment>
            : <UserRow key={i} msg={m}/>
        ))}
        {typing && (
          <div className="row bot">
            <BotAvatar size={32}/>
            <div className="col">
              <div className="bubble bot-bubble typing-bubble"><TypingDots/></div>
            </div>
          </div>
        )}
      </div>
      {menuItems && (
        <MenuBar
          items={menuItems}
          onPick={(t) => handlePick(t)}
          onReset={handleReset}
          onBack={handleBackGrade}
          showBack={role === '학생' && !!grade}
        />
      )}
      <Composer
        value={input}
        onChange={setInput}
        onSend={() => { sendText(input); setInput(''); }}
        placeholder={role ? '메시지 입력' : '먼저 위에서 역할을 선택해 주세요'}
        disabled={!role}
      />
      <SearchOverlay
        open={search}
        onClose={() => setSearch(false)}
        onPick={(label) => handlePick(label)}
        role={role}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ChatApp/>);
</script>

</body>
</html>
